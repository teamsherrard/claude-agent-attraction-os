<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Rendered by shared/render_board.py — never edit the output by hand; edit this template. Layout: a four-tile strip (goals · today · this week · open items) over the map. The map is the Brain: the member in the centre, the nine parts of their Brain as the inner ring, the weekly systems as the outer ring. Every dot, tile and the centre opens the same right-hand document panel, filled from the member's own Brain files. Dark-only by design. */
:root{
  --bg:#070B12; --fg:#EEF2F8; --muted:#9AA6B8; --dim:#66728A; --line:rgba(255,255,255,.09);
  --accent:#2BD88A; --accent2:#8EF3C6; --amber:#F2B84B; --panel:#0E141F; --panel2:#0A1019; --code:rgba(0,0,0,.45);
  --display:'Sora',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --pw:min(660px,52vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;transition:margin .32s ease,max-width .32s ease}
body.open .wrap{margin-right:var(--pw);max-width:none}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(7,11,18,.6)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:8px;vertical-align:1px}
button.chip{cursor:pointer}
button.chip:hover{border-color:rgba(43,216,138,.5);color:var(--fg)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0 4px}
@media (min-width:981px){body.open .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1700px){body.open .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{text-align:left;min-width:0;padding:14px 16px 15px;border-radius:16px;border:1px solid var(--line);background:rgba(14,20,31,.72);cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:border-color .2s,transform .2s;backdrop-filter:blur(6px)}
.tile:hover{border-color:rgba(43,216,138,.5);transform:translateY(-1px)}
.tile.amber:hover,.tile.amber.active{border-color:rgba(242,184,75,.6)}
.tile.active{border-color:rgba(43,216,138,.6)}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
.tile .k .r{color:var(--dim);letter-spacing:.04em;text-transform:none}
.tile.amber .k{color:var(--amber)}
.tile .big{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.28;text-wrap:balance}
.tile .small{font-size:13px;color:var(--muted);line-height:1.45}
.tile ol{margin:0;padding-left:18px;font-size:13px;color:var(--fg);line-height:1.4;display:flex;flex-direction:column;gap:3px}
.tile code{font-family:var(--mono);font-size:12px;background:var(--code);padding:5px 9px;border-radius:7px;color:var(--accent2);display:inline-block;max-width:100%;white-space:normal;word-break:break-word;line-height:1.4}
.ring{display:flex;align-items:center;gap:12px}
.ring svg{width:56px;height:56px;flex:none;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
.ring .rfg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(43,216,138,.6))}
.ring .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.ring .l{font-size:12px;color:var(--muted);line-height:1.3}
.mini{display:flex;flex-direction:column;gap:5px}
.mb{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mb .lab{display:flex;justify-content:space-between;gap:6px;min-width:0}
.mb .lab b{color:var(--fg);font-weight:500}
.mb .t{height:4px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
.mb .f{height:100%;background:var(--accent);border-radius:2px}
.tile .n2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.tile .n2 span{font-size:13px;font-family:var(--body);font-weight:600;color:var(--muted);margin-left:6px}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0 0}
#map{width:min(100%,calc(70vh * 1.111));max-width:1000px;height:auto;display:block;overflow:visible}

.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);padding:2px 0 10px}
.legend .on{color:var(--accent2)}.legend .now{color:var(--amber)}.legend .op{color:var(--amber)}
.chips{display:none;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 0 14px}
.chips button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chips button.now{border-color:rgba(242,184,75,.5);color:var(--amber)}
.chips button.soon{color:var(--dim)}
.foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);padding:0 0 26px;line-height:1.6}

/* SVG map */
.rng{fill:none;stroke:rgba(43,216,138,.18);stroke-dasharray:2 7;transform-box:fill-box;transform-origin:center;animation:spin 150s linear infinite}
.rng.outer{stroke:rgba(255,255,255,.08);animation-duration:240s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.web{stroke:rgba(142,243,198,.09);stroke-width:1;fill:none}
.spoke{stroke:rgba(43,216,138,.4);stroke-width:1.4;fill:none}
.spoke.soon{stroke:rgba(255,255,255,.11);stroke-dasharray:3 6}
.spoke.now{stroke:rgba(242,184,75,.65);stroke-dasharray:4 5}
.node{cursor:pointer;outline:none}
.node .halo{fill:var(--accent);opacity:.14;transition:opacity .2s}
.node .dot{fill:var(--accent);filter:url(#glow)}
.node.soon .dot{fill:var(--bg);stroke:rgba(255,255,255,.42);stroke-width:1.5;filter:none}
.node.soon .halo{opacity:0}
.node.now .dot{fill:var(--amber)}
.node.now .halo{fill:var(--amber)}
.node:hover .halo,.node:focus-visible .halo,.node.active .halo{opacity:.36}
.node.soon:hover .halo,.node.soon.active .halo{opacity:.12}
.node.active .ringsel{opacity:1}
.ringsel{fill:none;stroke:#fff;stroke-width:1.2;opacity:0;transition:opacity .2s}
.node:focus-visible .dot{stroke:#fff;stroke-width:2}
.notch{fill:var(--amber);stroke:var(--bg);stroke-width:2}
.label{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:.06em;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round;pointer-events:none}
.label .wk{fill:var(--accent)}
.node.soon .label{fill:var(--dim)}.node.soon .label .wk{fill:var(--dim)}
.node.now .label{fill:var(--amber)}.node.now .label .wk{fill:var(--amber)}
.signal{fill:var(--accent2);filter:url(#glow)}
.signal.now{fill:var(--amber)}
.core{filter:url(#glow)}
.pulse{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.ctext{font-family:var(--display);font-weight:800;font-size:22px;fill:#fff;letter-spacing:.02em;pointer-events:none}
.csub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;fill:var(--accent2);pointer-events:none}
.centre{cursor:pointer;outline:none}
.centre .cring{fill:none;stroke:rgba(142,243,198,.6);stroke-width:1;transition:stroke-width .2s,stroke .2s}
.centre:hover .cring,.centre:focus-visible .cring,.centre.active .cring{stroke:#fff;stroke-width:2}

/* the document panel: white paper over the dark screen. Every colour inside it comes from these re-mapped tokens. */
#panel{--fg:#15202B;--muted:#56626F;--dim:#7B8593;--line:rgba(12,24,36,.12);--accent:#147A4E;--accent2:#0E6A43;--amber:#A86C0C;--code:rgba(20,122,78,.09);--panel:#F3F6F8;--panel2:#FFFFFF;--bg:#FFFFFF;color-scheme:light;color:var(--fg);
  position:fixed;top:0;right:0;bottom:0;width:var(--pw);z-index:20;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--line);
  box-shadow:-24px 0 60px rgba(0,0,0,.5);transform:translateX(102%);visibility:hidden;transition:transform .32s ease,visibility 0s linear .32s;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
body.open #panel{transform:none;visibility:visible;transition:transform .32s ease}
#panel::before{content:'';position:absolute;inset:0 0 auto 0;height:240px;pointer-events:none;background:linear-gradient(180deg,rgba(20,122,78,.10),transparent)}
#panel[data-state="now"]::before{background:linear-gradient(180deg,rgba(242,184,75,.16),transparent)}
#panel[data-state="soon"]::before{background:linear-gradient(180deg,rgba(12,24,36,.05),transparent)}
#panel .pbar button{background:rgba(12,24,36,.03)}
#panel .pbar button:hover{border-color:rgba(12,24,36,.3)}
#panel th{background:rgba(12,24,36,.035)}
#panel .doclink{background:rgba(12,24,36,.03)}
#panel .tracker{background:#F7F9FA}
#panel .tracker .rbg{stroke:rgba(12,24,36,.09)}
#panel .tracker .rfg{filter:drop-shadow(0 0 4px rgba(20,122,78,.35))}
#panel .bar .bt{background:rgba(12,24,36,.09)}
#panel .sw .chipc{border-color:rgba(12,24,36,.15)}
#panel .waiting{background:rgba(242,184,75,.10);border-color:rgba(168,108,12,.45)}
#panel .copy:hover,#panel .toc button:hover{border-color:rgba(12,24,36,.35)}
#panel .moves .tick{border-color:rgba(12,24,36,.3)}
#panel .sd{border-color:rgba(12,24,36,.2)}
#panel .wd.today{background:rgba(242,184,75,.10)}
#panel ::selection{background:rgba(20,122,78,.2)}
@media (max-width:640px){.hright{align-items:stretch;width:100%}.search{width:100%}}
.pbar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.pbar button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer}
.pbar button:hover{color:var(--fg);border-color:rgba(255,255,255,.25)}
.pnav{display:flex;align-items:center;gap:8px}
.pnav span{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.pscroll{position:relative;z-index:1;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.doc{padding:26px 32px 60px;max-width:72ch}
.doc .eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc .eyebrow.now{color:var(--amber)}.doc .eyebrow.soon{color:var(--dim)}
.doc h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.12;letter-spacing:-.015em;margin:10px 0 8px;text-wrap:balance;outline:none}
.doc .tagline{font-size:17px;color:var(--muted);margin:0 0 14px;line-height:1.45;text-wrap:pretty}
.doc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.03em;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.doc h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px;margin:30px 0 12px;font-weight:500}
.doc h3::after{content:'';flex:1;height:1px;background:var(--line)}
#panel[data-state="now"] .doc h3{color:var(--amber)}
#panel[data-state="soon"] .doc h3{color:var(--muted)}
.doc p{margin:0 0 14px;font-size:15.5px;line-height:1.65;text-wrap:pretty}
.doc p.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.doc blockquote{margin:22px 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);font-family:var(--display);font-weight:600;font-size:19px;line-height:1.4;text-wrap:pretty}
#panel[data-state="now"] .doc blockquote{border-color:var(--amber)}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px;font-size:15.5px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.doc strong{font-weight:700}
.kv{margin:0 0 16px;display:flex;flex-direction:column}
.kv>div{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px;line-height:1.4}
.kv dd{margin:0;font-size:15px;line-height:1.5}
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45;color:inherit}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:500;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;min-width:110px}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.status{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:0}
.status li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.status .ic{font-family:var(--mono);font-size:15px;line-height:1.3;color:var(--accent2)}
.status li.now .ic{color:var(--amber)}.status li.soon .ic{color:var(--dim)}
.status .sl{font-size:15px;line-height:1.45}
.status li.soon .sl{color:var(--muted)}
.status .sn{font-size:13px;color:var(--dim);margin-top:2px;line-height:1.45}
.status .wk{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-left:6px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:0 0 16px}
.sw{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.sw .chipc{width:34px;height:34px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.15)}
.sw .sl{font-size:14px;font-weight:600}
.sw .sn{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
.toc button{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:rgba(255,255,255,.3)}
.links{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.links .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.links .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.doclink{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);cursor:pointer}
.doclink:hover{border-color:rgba(43,216,138,.6);color:var(--accent2)}
.waiting{margin:18px 0 6px;padding:14px 16px;border-radius:14px;border:1px solid rgba(242,184,75,.45);background:rgba(242,184,75,.07)}
.waiting .wh{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.waiting .wi{font-size:14.5px;line-height:1.5;padding:8px 0;border-top:1px solid rgba(242,184,75,.2)}
.waiting .wi:first-of-type{border-top:0;padding-top:0}
.om{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.doc code{font-family:var(--mono);font-size:12.5px;background:var(--code);padding:6px 10px;border-radius:8px;color:var(--accent2);word-break:break-word}
.copy{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.copy:hover{color:var(--fg);border-color:rgba(255,255,255,.3)}
.copy.ok{color:var(--accent2);border-color:rgba(43,216,138,.6)}
.dos{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.do .dc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.do .dn{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.openlist{list-style:none;padding:0;margin:0 0 16px;counter-reset:oi;display:flex;flex-direction:column}
.openlist li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.openlist li::before{counter-increment:oi;content:counter(oi);font-family:var(--mono);font-size:12px;color:var(--amber);padding-top:3px}
.openlist .ot{font-size:15px;line-height:1.5}
.tracker{margin:4px 0 18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02);display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.tracker .ringbox{text-align:center}
.tracker .ringbox svg{width:110px;height:110px;transform:rotate(-90deg)}
.tracker .rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8}
.tracker .rfg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(43,216,138,.6))}
.tracker .rnum{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin-top:-72px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tracker .rnum span{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-top:3px}
.tracker .rlab{font-size:12px;color:var(--muted);line-height:1.35;margin-top:14px}
.bars{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
.bar .bl b{color:var(--fg);font-weight:500}
.bar .bt{height:6px;background:rgba(255,255,255,.09);border-radius:3px;overflow:hidden}
.bar .bf{height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.tracker .tfoot{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.03em;border-top:1px solid var(--line);padding-top:10px}
.tracker .tfoot b{color:var(--accent2);font-weight:500}
.pfoot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}

/* header: search + week segments */
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.search{position:relative;width:min(440px,100%)}
.search svg{position:absolute;left:12px;top:50%;width:15px;height:15px;margin-top:-7px;fill:none;stroke:var(--dim);stroke-width:2;pointer-events:none}
.search input{width:100%;font:inherit;font-size:13.5px;padding:9px 12px 9px 34px;border-radius:999px;border:1px solid var(--line);background:rgba(14,20,31,.8);color:var(--fg);outline:none}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:rgba(43,216,138,.6)}
.qres{position:absolute;top:calc(100% + 6px);right:0;left:0;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);padding:6px;max-height:min(60vh,460px);overflow:auto}
.qh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 10px 4px}
.qr{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--fg)}
.qr:hover,.qr:focus-visible{background:rgba(255,255,255,.05)}
.qr b{display:block;font-family:var(--display);font-weight:600;font-size:13.5px}
.qr span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.qr mark{background:rgba(43,216,138,.22);color:var(--accent2);border-radius:3px;padding:0 2px}
.qr code{font-family:var(--mono);font-size:12px;color:var(--accent2);background:var(--code);padding:4px 8px;border-radius:6px}
.qn{padding:10px;font-size:13px;color:var(--muted)}
.chip .segs{display:inline-flex;gap:3px;margin-right:8px;vertical-align:-1px}
.chip .segs i{display:inline-block;width:9px;height:5px;border-radius:2px;background:rgba(255,255,255,.12)}
.chip .segs i.d{background:var(--accent)}.chip .segs i.n{background:var(--amber)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(242,184,75,.45);padding:2px 7px;border-radius:999px}
/* tiles: daily slice, checkable moves */
.slice{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.sd{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.sd.done{background:rgba(43,216,138,.18);border-color:var(--accent);color:var(--accent2)}
.sd.today{border-color:var(--amber);color:var(--amber)}
.slice .sl{margin-left:4px}
.moves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;counter-reset:mv}
.moves li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.4;color:var(--fg)}
.moves .tick{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;padding:0;color:var(--accent2);font-size:11px;line-height:1;margin-top:1px}
.moves .tick:hover{border-color:var(--accent)}
.moves li.done .tick{background:rgba(43,216,138,.2);border-color:var(--accent)}
.moves li.done .mt{color:var(--dim);text-decoration:line-through}
.moves .mt::before{counter-increment:mv;content:counter(mv) '. ';color:var(--muted)}
.doc .moves li{font-size:15.5px;gap:10px;grid-template-columns:22px 1fr}
.doc .moves .tick{width:20px;height:20px;margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:6px;margin:0 0 16px;overflow-x:auto;padding-bottom:4px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0;font-size:12px;line-height:1.35;color:var(--muted)}
.wd .dn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:4px}
.wd.done{border-color:rgba(43,216,138,.35)}.wd.done .dn{color:var(--accent2)}
.wd.today{border-color:var(--amber);background:rgba(242,184,75,.06);color:var(--fg)}.wd.today .dn{color:var(--amber)}
.openlist li.done .ot{color:var(--dim);text-decoration:line-through}
.openlist.donelist{counter-reset:oi}
.hit{background:rgba(43,216,138,.12);border-radius:6px;box-shadow:0 0 0 6px rgba(43,216,138,.12)}
.linkish{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;text-decoration:underline;cursor:pointer;padding:0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:40;font-family:var(--mono);font-size:12px;padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid rgba(43,216,138,.5);color:var(--accent2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
/* map: the connections of the open page */
.rel-line{stroke:var(--accent);stroke-width:1.3;fill:none;stroke-dasharray:4 7;opacity:.75;animation:dash 1.4s linear infinite}
.rel-line.now{stroke:var(--amber)}
@keyframes dash{to{stroke-dashoffset:-22}}
.node.rel .halo{opacity:.3}
.node.rel.soon .halo{opacity:.12}
.node.rel .label{fill:var(--accent2)}
.node.rel.soon .label{fill:var(--muted)}
@media (max-width:1180px){:root{--pw:min(600px,56vw)}}
@media (max-width:980px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  :root{--pw:100vw}
  body.open{overflow:hidden}
  body.open .wrap{margin-right:0}
  .doc{padding:20px 18px 56px}
  .tracker{grid-template-columns:1fr}
}
@media (max-width:640px){
  .label{display:none}
  .chips{display:flex}
  .name{font-size:19px}
  #map{width:100%}
  .doc h2{font-size:25px}
}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pulse,.rng{animation:none}.pulse{opacity:.35}.wrap,#panel{transition:none}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Agent Attraction Brain</div>
      <div class="name" id="hName"></div>
    </div>
    <div class="hright">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Find anything in your Brain, or what to say" aria-label="Search your Brain" autocomplete="off">
        <div id="qres" class="qres" hidden></div>
      </div>

        <span class="chip"><span class="segs" id="hSegs" aria-hidden="true"></span><span id="hWeek"></span></span>

  </div>

  <div class="legend"><span class="on">● built</span><span class="now">◐ this week</span><span>○ coming</span><span class="op">· amber mark = waiting on you</span><span>click any dot to open its page</span></div>
  <div class="chips" id="chips" aria-label="Parts of the board"></div>

    </article>
  </div>
</aside>

<script>
(function(){
'use strict';
/* ───────────────────────── DATA: injected by shared/render_board.py from the member's Brain ───────────────────────── */
const D=/*__BOARD_DATA__*/null;
const GOALS=D.GOALS,OPEN=D.OPEN,MOVES=D.MOVES,WEEK=D.WEEK,CHANGED=D.CHANGED,DAY=D.DAY,INNER=D.INNER,OUTER=D.OUTER,EXTRA=D.EXTRA,HDR=D.HEADER,T=D.TILES;
const LS={get(k){try{return JSON.parse(localStorage.getItem('bb:'+k));}catch(e){return null;}},set(k,v){try{localStorage.setItem('bb:'+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem('bb:'+k);}catch(e){}}};
let doneMoves=LS.get('moves:'+DAY)||[],doneOpen=LS.get('open:'+D.STAMP)||[];
const openLeft=()=>OPEN.map((o,i)=>({o,i})).filter(x=>!doneOpen.includes(x.i));

/* ───────────────────────── docs index ───────────────────────── */
const DOCS={};
INNER.forEach((d,i)=>{d.ring='inner';d.state='built';d.eyebrow='SECTION '+(i+1)+' OF 9 · '+d.label;DOCS[d.id]=d;});
OUTER.forEach(d=>{d.ring='outer';d.eyebrow='WEEK '+d.week.slice(1)+' · '+d.label+' · '+(d.state==='built'?'BUILT':d.state==='now'?'THIS WEEK':'COMING');DOCS[d.id]=d;});
Object.keys(EXTRA).forEach(k=>{const d=EXTRA[k];d.id=k;d.state=k==='open-items'||k==='today'?'now':'built';DOCS[k]=d;});

/* ───────────────────────── renderer: Book-style text in, document out ───────────────────────── */
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const parts=s=>s.split(' | ').map(x=>x.trim());
const ICON={done:'✓',now:'◐',soon:'○',built:'✓'};
const title=s=>s.charAt(0)+s.slice(1).toLowerCase();

function table(rows){
  if(!rows.length) return '';
  if(rows.every(r=>r.length===2)) return '<dl class="kv">'+rows.map(r=>'<div><dt>'+inl(r[0])+'</dt><dd>'+inl(r[1])+'</dd></div>').join('')+'</dl>';
  const h=rows[0], b=rows.slice(1);
  return '<div class="tw"><table><thead><tr>'+h.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function statusList(it){
  return '<ul class="status">'+it.map(p=>{const label=p[0],state=p[1]||'soon',note=p[2]||'';return '<li class="'+esc(state)+'"><span class="ic">'+(ICON[state]||'○')+'</span><div><div class="sl">'+inl(label)+'</div>'+(note?'<div class="sn">'+inl(note)+'</div>':'')+'</div></li>';}).join('')+'</ul>';
}
function swatches(it){
  return '<div class="swatches">'+it.map(p=>'<div class="sw"><span class="chipc" style="background:'+esc(p[0])+'"></span><div><div class="sl">'+inl(p[1])+'</div><div class="sn">'+esc(p[0])+' · '+inl(p[2]||'')+'</div></div></div>').join('')+'</div>';
}
function systemsList(){
  return '<ul class="status">'+OUTER.map(d=>'<li class="'+d.state+'"><span class="ic">'+ICON[d.state]+'</span><div><div class="sl"><button type="button" class="doclink" data-doc="'+d.id+'">'+esc(title(d.label))+'</button><span class="wk">WEEK '+d.week.slice(1)+'</span></div><div class="sn">'+inl(d.line)+'</div></div></li>').join('')+'</ul>';
}
function phraseBits(o){
  if(o.phrase) return '<code>'+esc(o.phrase)+'</code><button type="button" class="copy" data-copy="'+esc(o.phrase)+'">copy</button>';
  return o.how?'<span class="sn" style="font-size:13px;color:var(--muted)">'+inl(o.how)+'</span>':'';
}
function phraseRow(o){const b=phraseBits(o);return b?'<div class="om">'+b+'</div>':'';}
function openList(){
  const rows=OPEN.map((o,i)=>({o,i})),left=rows.filter(r=>!doneOpen.includes(r.i)),done=rows.filter(r=>doneOpen.includes(r.i));
  const item=r=>{const d=DOCS[r.o.node],dn=doneOpen.includes(r.i);return '<li class="'+(dn?'done':'')+'"><div><div class="ot">'+inl(r.o.text)+'</div><div class="om"><span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)">On</span><button type="button" class="doclink" data-doc="'+r.o.node+'">'+esc(d.title)+'</button><button type="button" class="copy mark" data-oi="'+r.i+'">'+(dn?'undo':'mark done')+'</button></div>'+(dn?'':phraseRow(r.o))+'</div></li>';};
  return (left.length?'<ol class="openlist">'+left.map(item).join('')+'</ol>':'<p class="note">Nothing waiting on you right now. Your Brain adds the next item when a file asks for one.</p>')+(done.length?'<h3>Done</h3><ol class="openlist donelist">'+done.map(item).join('')+'</ol>':'');
}
function movesHTML(){return '<ul class="moves">'+MOVES.map((m,i)=>{const dn=doneMoves.includes(i);return '<li class="'+(dn?'done':'')+'"><button type="button" class="tick" data-mv="'+i+'" aria-pressed="'+dn+'" aria-label="'+(dn?'Done: ':'Mark done: ')+esc(m)+'">'+(dn?'✓':'')+'</button><span class="mt">'+esc(m)+'</span></li>';}).join('')+'</ul>';}
function weekHTML(){return '<div class="week">'+WEEK.map(w=>'<div class="wd '+w.s+'"><div class="dn"><span>'+w.d+'</span><span>'+w.n+'</span></div>'+inl(w.t)+'</div>').join('')+'</div>';}
function changedHTML(){return '<ul class="status">'+Object.keys(CHANGED).map(id=>{const d=DOCS[id];return '<li class="now"><span class="ic">◐</span><div><div class="sl"><button type="button" class="doclink" data-doc="'+id+'">'+esc(d.title)+'</button></div><div class="sn">'+inl(CHANGED[id])+'</div></div></li>';}).join('')+'</ul>';}
function bar(label,v,t){const w=Math.max(0,Math.min(100,Math.round(v/t*100)));return '<div class="bar"><div class="bl"><span>'+esc(label)+'</span><span><b>'+v+'</b> of '+t+' · day 90</span></div><div class="bt"><div class="bf" style="width:'+w+'%"></div></div></div>';}
function trackerBlock(){
  const g=GOALS,C=2*Math.PI*40,p=g.today/g.twelve;
  return '<div class="tracker"><div class="ringbox"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rbg" cx="50" cy="50" r="40"/><circle class="rfg" cx="50" cy="50" r="40" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div class="rnum">'+g.today+'<span>of '+g.twelve+' agents</span></div><div class="rlab">your organization today, against the 12-month goal · long term: '+g.longTerm+'</div></div>'
   +'<div class="bars">'+bar('Conversations',g.sofar.conv,g.q90.conv)+bar('Calls held',g.sofar.held,g.q90.held)+bar('Joins',g.sofar.joins,g.q90.joins)+bar('Content shipped',g.sofar.content,g.q90.content)+'</div>'
   +'<div class="tfoot">Day '+g.day+' of 90 \u00b7 quarter '+esc(g.quarter)+(g.score?' \u00b7 the Brain\u2019s score from your rows: <b>'+esc(g.score)+'</b>':'')+'</div></div>';
}
function render(text,id){
  const lines=text.split('\n');let out=[],para=[],i=0;
  const flush=()=>{if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[];}};
  const isT=l=>l.startsWith('|');
  while(i<lines.length){
    const l=lines[i].trim();
    if(!l){flush();i++;continue;}
    if(l.startsWith('## ')){flush();const t=l.slice(3).trim();out.push('<h3 id="h-'+id+'-'+slug(t)+'">'+inl(t)+'</h3>');i++;continue;}
    if(isT(l)){flush();const rows=[];while(i<lines.length&&isT(lines[i].trim())){const r=lines[i].trim();if(!/^\|\s*-+/.test(r))rows.push(r.slice(1,-1).split('|').map(c=>c.trim()));i++;}out.push(table(rows));continue;}
    if(l.startsWith('>> ')){flush();out.push('<blockquote>'+inl(l.slice(3))+'</blockquote>');i++;continue;}
    if(/^• /.test(l)){flush();const it=[];while(i<lines.length&&/^• /.test(lines[i].trim())){it.push(lines[i].trim().slice(2));i++;}out.push('<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');continue;}
    if(/^\d+\.\s+/.test(l)){flush();const it=[];while(i<lines.length&&/^\d+\.\s+/.test(lines[i].trim())){it.push(lines[i].trim().replace(/^\d+\.\s+/,''));i++;}out.push('<ol>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>');continue;}
    if(l.startsWith('@status:')){flush();const it=[];while(i<lines.length&&lines[i].trim().startsWith('@status:')){it.push(parts(lines[i].trim().slice(8)));i++;}out.push(statusList(it));continue;}
    if(l.startsWith('@swatch:')){flush();const it=[];while(i<lines.length&&lines[i].trim().startsWith('@swatch:')){it.push(parts(lines[i].trim().slice(8)));i++;}out.push(swatches(it));continue;}
    if(l.startsWith('@note:')){flush();out.push('<p class="note">'+inl(l.slice(6).trim())+'</p>');i++;continue;}
    if(l.startsWith('@link:')){flush();const p=parts(l.slice(6));out.push('<p><button type="button" class="doclink" data-doc="'+esc(p[0])+'">'+inl(p[1]||'Open')+' →</button></p>');i++;continue;}
    if(l==='@toc'){flush();out.push('<!--TOC-->');i++;continue;}
    if(l==='@systems'){flush();out.push(systemsList());i++;continue;}
    if(l==='@openlist'){flush();out.push(openList());i++;continue;}
    if(l==='@tracker'){flush();out.push(trackerBlock());i++;continue;}
    if(l==='@moves'){flush();out.push(movesHTML());i++;continue;}
    if(l==='@week'){flush();out.push(weekHTML());i++;continue;}
    if(l==='@changed'){flush();out.push(changedHTML());i++;continue;}
    para.push(l);i++;
  }
  flush();
  let html=out.join('\n');
  if(html.includes('<!--TOC-->')){
    const hs=[];html.replace(/<h3 id="([^"]+)">(.*?)<\/h3>/g,(m,a,b)=>{hs.push([a,b]);return m;});
    html=html.replace('<!--TOC-->','<div class="toc">'+hs.map(h=>'<button type="button" data-jump="'+h[0]+'">'+h[1]+'</button>').join('')+'</div>');
  }
  return html;
}

/* ───────────────────────── the panel ───────────────────────── */
const panel=document.getElementById('panel'),pScroll=document.getElementById('pScroll'),pEye=document.getElementById('pEye'),pTitle=document.getElementById('pTitle'),pTag=document.getElementById('pTag'),pMeta=document.getElementById('pMeta'),pOpen=document.getElementById('pOpen'),pLinks=document.getElementById('pLinks'),pBody=document.getElementById('pBody'),pActions=document.getElementById('pActions'),pFoot=document.getElementById('pFoot'),pNav=document.getElementById('pNav'),pPos=document.getElementById('pPos'),pPrev=document.getElementById('pPrev'),pNext=document.getElementById('pNext');
let cur=null,activeEl=null,opener=null;

function chipRow(k,ids){return '<div class="row"><span class="k">'+esc(k)+'</span>'+ids.map(id=>{const d=DOCS[id];return d?'<button type="button" class="doclink" data-doc="'+id+'">'+esc(title(d.label||d.title))+'</button>':'';}).join('')+'</div>';}
function flash(btn,txt){const o=btn.textContent;btn.textContent=txt;btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1600);}
function copyText(t,btn){
  const fail=()=>{const code=btn.previousElementSibling;if(code&&window.getSelection){const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);}flash(btn,'select & copy');};
  try{navigator.clipboard.writeText(t).then(()=>flash(btn,'copied ✓')).catch(fail);}catch(e){fail();}
}
function wire(root){
  root.querySelectorAll('.doclink').forEach(b=>{b.onclick=e=>{e.stopPropagation();openDoc(b.dataset.doc);};});
  root.querySelectorAll('.copy').forEach(b=>{b.onclick=e=>{e.stopPropagation();copyText(b.dataset.copy,b);};});
  root.querySelectorAll('.mark').forEach(b=>{b.onclick=e=>{e.stopPropagation();toggleOpen(+b.dataset.oi);};});
  root.querySelectorAll('[data-jump]').forEach(b=>{b.onclick=()=>{const t=document.getElementById(b.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});};});
  wireTicks(root);
}
function setActive(el){if(activeEl)activeEl.classList.remove('active');activeEl=el||null;if(activeEl)activeEl.classList.add('active');}
function openDoc(id,from,opts){
  const d=DOCS[id];if(!d)return;opts=opts||{};
  if(from)opener=from;
  cur=id;const st=d.state||'built';
  panel.dataset.state=st;
  let eye=d.eyebrow,tag=d.tagline||'';
  if(id==='open-items'){const n=openLeft().length;eye='WAITING ON YOU · '+n+' OPEN ITEM'+(n===1?'':'S');tag=n?n+' thing'+(n===1?'':'s')+' your Brain is waiting on. Each one is a real line in one of your files, not a reminder someone typed.':'Nothing is waiting on you. Your Brain adds the next item when a file asks for one.';}
  pEye.textContent=eye;pEye.className='eyebrow '+st;
  pTitle.textContent=d.title;
  pTag.textContent=tag;pTag.hidden=!tag;
  pMeta.innerHTML=(CHANGED[id]?'<span class="tag">Updated this week</span>':'')+(d.meta||[]).map(m=>'<span>'+esc(m)+'</span>').join('');pMeta.hidden=!(d.meta&&d.meta.length);
  const items=OPEN.map((o,i)=>({o,i})).filter(x=>x.o.node===id&&!doneOpen.includes(x.i));
  pOpen.innerHTML=items.length?'<div class="waiting"><div class="wh">◐ Waiting on you</div>'+items.map(x=>'<div class="wi"><div>'+inl(x.o.text)+'</div><div class="om">'+phraseBits(x.o)+'<button type="button" class="copy mark" data-oi="'+x.i+'">mark done</button></div></div>').join('')+'</div>':'';
  let links='';
  if(d.feeds&&d.feeds.length)links+=chipRow('Read by',d.feeds);
  if(d.reads&&d.reads.length)links+=chipRow('Reads from your Brain',d.reads);
  pLinks.innerHTML=links;pLinks.hidden=!links;
  pBody.innerHTML=render(d.body,id);
  pActions.innerHTML=(d.actions&&d.actions.length)?'<h3>Say this in Cowork</h3><div class="dos">'+d.actions.map(a=>'<div class="do"><div class="dc"><code>'+esc(a.p)+'</code><button type="button" class="copy" data-copy="'+esc(a.p)+'">copy</button></div><div class="dn">'+inl(a.n)+'</div></div>').join('')+'</div>':'';
  pFoot.textContent=d.ring==='inner'?'From your Agent Attraction Brain Book · this page regenerates whenever your Brain changes · demo: every figure is illustrative':'From your Agent Attraction Brain · this page regenerates whenever your Brain changes · demo: every figure is illustrative';
  wire(panel);
  if(d.ring){const list=d.ring==='inner'?INNER:OUTER,k=list.findIndex(x=>x.id===id);pPos.textContent=(d.ring==='inner'?'Section ':'System ')+(k+1)+' of '+list.length;pPrev.dataset.doc=list[(k-1+list.length)%list.length].id;pNext.dataset.doc=list[(k+1)%list.length].id;pNav.hidden=false;}
  else pNav.hidden=true;
  if(!opts.keep){document.body.classList.add('open');pScroll.scrollTop=0;}
  setActive(d._el||document.querySelector('[data-doc="'+id+'"].tile')||(id==='glance'?centreG:null));
  showRel(d);
  try{history.replaceState(null,'','#'+id);}catch(e){}
  if(opts.q){const els=Array.from(pBody.querySelectorAll('p,li,dd,td,blockquote,.sl,.ot'));const hit=els.find(e=>e.textContent.toLowerCase().includes(opts.q));if(hit){hit.classList.add('hit');setTimeout(()=>hit.scrollIntoView({block:'center',behavior:'smooth'}),80);}}
  else if(!opts.keep)setTimeout(()=>{try{pTitle.focus({preventScroll:true});}catch(e){}},40);
}
function closeDoc(){
  if(!document.body.classList.contains('open'))return;
  document.body.classList.remove('open');cur=null;setActive(null);clearRel();
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(opener&&opener.focus){try{opener.focus({preventScroll:true});}catch(e){}}
}
document.getElementById('pClose').addEventListener('click',closeDoc);
pPrev.addEventListener('click',()=>openDoc(pPrev.dataset.doc));
pNext.addEventListener('click',()=>openDoc(pNext.dataset.doc));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDoc();return;}
  if(!cur||pNav.hidden||e.target.closest('input,textarea'))return;
  if(e.key==='ArrowLeft')openDoc(pPrev.dataset.doc);
  if(e.key==='ArrowRight')openDoc(pNext.dataset.doc);
});
function renderTiles(){
  const g=GOALS,C=2*Math.PI*26,p=g.twelve>0?Math.max(0,Math.min(1,g.today/g.twelve)):0;
  document.getElementById('tiles').innerHTML=
    '<div class="tile" role="button" tabindex="0" data-doc="goals" aria-label="Your goals and your tracker"><div class="k"><span>Your goals</span><span class="r">tracker</span></div>'
   +'<div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rbg" cx="32" cy="32" r="26"/><circle class="rfg" cx="32" cy="32" r="26" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div><div class="n">'+g.today+'<span>of '+g.twelve+'</span></div><div class="l">agents in your organization \u00b7 12-month goal</div></div></div>'
   +'<div class="mini">'+T.goals.bars.map(b=>'<div class="mb"><div class="lab"><span>'+esc(b.label)+'</span><b>'+b.v+' of '+b.t+'</b></div><div class="t"><div class="f" style="width:'+(b.t>0?Math.max(0,Math.min(100,Math.round(b.v/b.t*100))):0)+'%"></div></div></div>').join('')+'</div>'
   +'<div class="slice">'+T.goals.slice.map(s=>'<span class="sd '+s.s+'">'+esc(s.d)+'</span>').join('')+'<span class="sl">'+esc(T.goals.line)+'</span></div></div>'
   +'<div class="tile" role="button" tabindex="0" data-doc="today" aria-label="Today"><div class="k"><span>Today</span><span class="r">'+esc(T.today.k)+'</span></div><div id="moveList"></div><div class="small" id="moveSum"></div></div>'
   +'<div class="tile amber" role="button" tabindex="0" data-doc="'+esc(T.week.doc)+'" aria-label="This week"><div class="k"><span>This week</span><span class="r">'+esc(T.week.k)+'</span></div><div class="big">'+esc(T.week.big)+'</div><div class="small">'+esc(T.week.small)+'</div>'+(T.week.code?'<code>'+esc(T.week.code)+'</code>':'')+'</div>'
   +'<div class="tile amber" role="button" tabindex="0" data-doc="open-items" aria-label="Open items"><div class="k"><span>Waiting on you</span><span class="r">open items</span></div><div class="n2"><b id="openCount">0</b><span>things</span></div><div class="small" id="openSummary"></div></div>';
  document.getElementById('hName').textContent=HDR.name;
  document.getElementById('hWeek').textContent=HDR.weekLine;
  document.getElementById('hSegs').innerHTML=HDR.segs.map(s=>'<i class="'+s+'"></i>').join('');
  document.getElementById('hSync').textContent=HDR.syncLine;
  document.getElementById('hFoot').textContent=HDR.foot;
  document.title=HDR.title;

renderTiles();
document.querySelectorAll('header [data-doc], .tiles [data-doc]').forEach(b=>{b.addEventListener('click',e=>{if(e.target.closest('.tick'))return;openDoc(b.dataset.doc,b);});b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===b){e.preventDefault();openDoc(b.dataset.doc,b);}});});
document.getElementById('stage').addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('.centre'))closeDoc();});

/* ───────────────────────── the map ───────────────────────── */
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
const CX=500,CY=450,R1=200,R2=330;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const rad=d=>d*Math.PI/180;
const pos=(r,deg)=>[CX+r*Math.cos(rad(deg)),CY+r*Math.sin(rad(deg))];
const hasOpen=id=>openLeft().some(x=>x.o.node===id);

const defs=el('defs',{});
defs.innerHTML='<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
 +'<radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0C2A1D"/><stop offset=".72" stop-color="#123D2A"/><stop offset="1" stop-color="#2BD88A"/></radialGradient>'
 +'<radialGradient id="haze" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2BD88A" stop-opacity=".22"/><stop offset=".55" stop-color="#2BD88A" stop-opacity=".06"/><stop offset="1" stop-color="#2BD88A" stop-opacity="0"/></radialGradient>';
el('circle',{cx:CX,cy:CY,r:170,fill:'url(#haze)'});
el('circle',{cx:CX,cy:CY,r:R2,class:'rng outer'});
el('circle',{cx:CX,cy:CY,r:R1,class:'rng'});
const web=el('g',{}),spokes=el('g',{}),signals=el('g',{}),rel=el('g',{class:'relg'}),nodes=el('g',{});

function signal(x1,y1,x2,y2,delay,cls){
  if(reduce)return;
  const c=el('circle',{r:3,class:'signal'+(cls?' '+cls:'')},signals);
  el('animateMotion',{dur:'3.6s',repeatCount:'indefinite',begin:(-delay)+'s',path:'M'+x1+' '+y1+' L'+x2+' '+y2},c);
}
function label(g,x,y,anchor,d){
  const t=el('text',{x,y,class:'label','text-anchor':anchor,'dominant-baseline':'middle'},g);
  t.textContent=d.label;
  if(d.week){const s=el('tspan',{class:'wk'},t);s.textContent=' · '+d.week+(d.state==='built'?' ✓':'');}
}
function node(d,x,y,kind,lx,ly,anchor){
  const g=el('g',{class:'node '+kind+' '+(d.state||'built'),tabindex:0,role:'button','aria-label':d.title+(d.week?', week '+d.week.slice(1):'')+'. Opens its page.'},nodes);
  el('circle',{cx:x,cy:y,r:kind==='inner'?21:19,class:'halo'},g);
  el('circle',{cx:x,cy:y,r:kind==='inner'?16:14,class:'ringsel'},g);
  el('circle',{cx:x,cy:y,r:kind==='inner'?10:9,class:'dot'},g);
  d._notch=el('circle',{cx:x+9,cy:y-9,r:4.5,class:'notch'},g);
  if(!hasOpen(d.id))d._notch.style.display='none';
  label(g,lx,ly,anchor,d);
  g.addEventListener('click',e=>{e.stopPropagation();if(cur===d.id){closeDoc();return;}openDoc(d.id,g);});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoc(d.id,g);}});
  g.addEventListener('mouseenter',()=>{if(!cur)showRel(d);});
  g.addEventListener('mouseleave',()=>{if(!cur)clearRel();});
  d._el=g;d._x=x;d._y=y;
}
INNER.forEach((d,i)=>{
  const deg=-90+i*40,[x,y]=pos(R1,deg),c=Math.cos(rad(deg)),s=Math.sin(rad(deg));
  el('line',{x1:CX,y1:CY,x2:x,y2:y,class:'spoke'},spokes);
  signal(CX,CY,x,y,i*0.4);
  let lx,ly,anchor;
  if(Math.abs(c)>0.9){[lx,ly]=pos(R1+30,deg);anchor=c>0?'start':'end';}
  else{lx=x;ly=y+(s<0?-28:32);anchor='middle';}
  node(d,x,y,'inner',lx,ly,anchor);d._deg=deg;
});
OUTER.forEach((d,j)=>{
  const deg=-67.5+j*45,[x,y]=pos(R2,deg),[sx,sy]=pos(R1+18,deg),[ex,ey]=pos(R2-13,deg);
  el('line',{x1:sx,y1:sy,x2:ex,y2:ey,class:'spoke '+d.state},spokes);
  if(d.state==='built')signal(sx,sy,ex,ey,1+j*0.5);
  if(d.state==='now')signal(sx,sy,ex,ey,0.8,'now');
  INNER.forEach(p=>{let a=Math.abs(((p._deg-deg)%360+540)%360-180);if(a<=25)el('line',{x1:p._x,y1:p._y,x2:x,y2:y,class:'web'},web);});
  const c=Math.cos(rad(deg)),[lx,ly]=pos(R2+28,deg);
  node(d,x,y,'outer',lx,ly,c>0.25?'start':(c<-0.25?'end':'middle'));
});
const centreG=el('g',{class:'centre',tabindex:0,role:'button','aria-label':HDR.first+'. Opens your Brain at a glance.'});
el('circle',{cx:CX,cy:CY,r:76,class:'pulse'},centreG);
el('circle',{cx:CX,cy:CY,r:84,fill:'rgba(43,216,138,.05)'},centreG);
el('circle',{cx:CX,cy:CY,r:64,fill:'url(#core)',class:'core'},centreG);
el('circle',{cx:CX,cy:CY,r:64,class:'cring'},centreG);
const t1=el('text',{x:CX,y:CY-2,class:'ctext','text-anchor':'middle'},centreG);t1.textContent=HDR.first.toUpperCase();
const t2=el('text',{x:CX,y:CY+20,class:'csub','text-anchor':'middle'},centreG);t2.textContent='BRAIN · '+HDR.sections+'/9';
centreG.addEventListener('click',e=>{e.stopPropagation();if(cur==='glance'){closeDoc();return;}openDoc('glance',centreG);});
centreG.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoc('glance',centreG);}});

/* phone: chips instead of labels */
const chips=document.getElementById('chips');
INNER.concat(OUTER).forEach(d=>{const b=document.createElement('button');b.type='button';b.className=d.state||'';b.textContent=title(d.label)+(d.week?' · '+d.week:'');b.addEventListener('click',()=>openDoc(d.id,b));chips.appendChild(b);});

/* ───────────────────────── state: moves, open items, connections, search ───────────────────────── */
function toggleMove(i){doneMoves=doneMoves.includes(i)?doneMoves.filter(x=>x!==i):doneMoves.concat([i]);LS.set('moves:'+DAY,doneMoves);renderMoves();}
function renderMoves(){
  document.getElementById('moveList').innerHTML=movesHTML();
  const n=doneMoves.length;document.getElementById('moveSum').textContent=MOVES.length?((n===MOVES.length?'All '+n+' done.':(n?n+' of '+MOVES.length+' done.':''))+(T.today.sub?' '+T.today.sub:'')).trim():(T.today.sub||'');
  const inDoc=pBody.querySelector('.moves');if(inDoc)inDoc.outerHTML=movesHTML();
  wireTicks(document);
}
function wireTicks(root){root.querySelectorAll('.moves .tick').forEach(b=>{b.onclick=e=>{e.stopPropagation();toggleMove(+b.dataset.mv);};});}
function toggleOpen(i){const was=doneOpen.includes(i);doneOpen=was?doneOpen.filter(x=>x!==i):doneOpen.concat([i]);LS.set('open:'+D.STAMP,doneOpen);renderOpenState();toast(was?'Back on the list':'Marked done');}
function renderOpenState(){
  const left=openLeft();
  document.getElementById('openCount').textContent=left.length;
  document.getElementById('openSummary').textContent=left.length?left.map(x=>x.o.short).join(' · '):'Nothing waiting on you. Your Brain adds the next item when a file asks for one.';
  INNER.concat(OUTER).forEach(d=>{if(d._notch)d._notch.style.display=left.some(x=>x.o.node===d.id)?'':'none';});
  if(cur)openDoc(cur,null,{keep:true});
}
function clearRel(){while(rel.firstChild)rel.removeChild(rel.firstChild);document.querySelectorAll('#map .node.rel').forEach(n=>n.classList.remove('rel'));}
function showRel(d){
  clearRel();
  let ids=d.feeds||d.reads||[];
  if(d.id==='open-items')ids=Array.from(new Set(openLeft().map(x=>x.o.node)));
  if(d.id==='goals')ids=['your-numbers','ai-admin','conversion'];
  const ox=d._x!=null?d._x:CX,oy=d._y!=null?d._y:CY;
  ids.forEach(id=>{const t=DOCS[id];if(!t||!t._el)return;t._el.classList.add('rel');if(reduce)return;el('line',{x1:ox,y1:oy,x2:t._x,y2:t._y,class:'rel-line'+(d.state==='now'?' now':'')},rel);});
}
let toastT=0;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('resetDemo').addEventListener('click',()=>{LS.del('moves:'+DAY);LS.del('open:'+D.STAMP);doneMoves=[];doneOpen=[];renderMoves();renderOpenState();toast('Checkmarks reset');});

/* search: pages, and what to say */
const INDEX=Object.values(DOCS).map(d=>({id:d.id,title:d.title,text:((d.tagline||'')+' '+d.body.replace(/^@.*$/gm,' ').replace(/[|#>]+/g,' ').replace(/\s+/g,' ')).trim()}));
const PHRASES=[];(function(){const seen=new Set();Object.values(DOCS).forEach(d=>(d.actions||[]).forEach(a=>{if(!seen.has(a.p)){seen.add(a.p);PHRASES.push({id:d.id,p:a.p,n:a.n});}}));})();
function snippet(text,v,i){const s=Math.max(0,i-60),e=Math.min(text.length,i+v.length+90);return (s>0?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+v.length))+'</mark>'+esc(text.slice(i+v.length,e))+(e<text.length?'…':'');}
const qIn=document.getElementById('q'),qRes=document.getElementById('qres');
function doSearch(){
  const v=qIn.value.trim().toLowerCase();
  if(v.length<2){qRes.hidden=true;qRes.innerHTML='';return;}
  const pages=INDEX.map(x=>{const i=x.text.toLowerCase().indexOf(v),inT=x.title.toLowerCase().includes(v);return (inT||i>=0)?{x,i,inT}:null;}).filter(Boolean).sort((a,b)=>(b.inT?1:0)-(a.inT?1:0)).slice(0,6);
  const ph=PHRASES.filter(a=>(a.p+' '+a.n).toLowerCase().includes(v)).slice(0,4);
  let h='';
  if(pages.length)h+='<div class="qh">Pages</div>'+pages.map(r=>'<button type="button" class="qr" data-doc="'+r.x.id+'"><b>'+esc(r.x.title)+'</b><span>'+(r.i>=0?snippet(r.x.text,v,r.i):esc(r.x.text.slice(0,120))+'…')+'</span></button>').join('');
  if(ph.length)h+='<div class="qh">What to say in Cowork</div>'+ph.map(a=>'<button type="button" class="qr ph" data-doc="'+a.id+'" data-copy="'+esc(a.p)+'"><code>'+esc(a.p)+'</code><span>'+esc(a.n)+'</span></button>').join('');
  if(!h)h='<div class="qn">Nothing in your Brain matches that yet.</div>';
  qRes.innerHTML=h;qRes.hidden=false;
  qRes.querySelectorAll('.qr').forEach(b=>{b.onclick=()=>{if(b.dataset.copy){try{navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('Copied: '+b.dataset.copy)).catch(()=>toast('Select the phrase on the page to copy it'));}catch(e){}}openDoc(b.dataset.doc,qIn,{q:b.dataset.copy?null:v});qRes.hidden=true;};});
}
let qT=0;qIn.addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(doSearch,120);});
qIn.addEventListener('focus',()=>{if(qIn.value.trim().length>=2)doSearch();});
qIn.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=qRes.querySelector('.qr');if(f)f.click();}if(e.key==='Escape'){qIn.value='';qRes.hidden=true;}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))qRes.hidden=true;});

renderMoves();renderOpenState();

/* deep link */
const h=(location.hash||'').slice(1);
if(h&&DOCS[h])openDoc(h);

/* background: a slow particle field */
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');let pts=[],raf=0,W=0,H=0;
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
  const n=Math.min(110,Math.floor(innerWidth*innerHeight/11000));
  pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18*devicePixelRatio,vy:(Math.random()-.5)*.18*devicePixelRatio}));}
function tick(){
  ctx.clearRect(0,0,W,H);const L=130*devicePixelRatio;
  for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
  ctx.lineWidth=1;
  for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<L){ctx.strokeStyle='rgba(43,216,138,'+((1-d/L)*.16).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
  ctx.fillStyle='rgba(142,243,198,.5)';
  for(const p of pts){ctx.beginPath();ctx.arc(p.x,p.y,1.3*devicePixelRatio,0,Math.PI*2);ctx.fill();}
  raf=requestAnimationFrame(tick);
}
if(!reduce){size();tick();addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else tick();});}
})();
</script>
