red, never copied) | a whiteboard-first explainer channel (the board is the brand) · a cream-and-green stationery line (the paper feel) · a Sunday newsletter's typography (serif headline, quiet body) — all unnamed |\n\n### Colors (direction — ~4–5 with hex + role; proposed by the Brain, confirmed by the style sheet)\n• Dominant: #F4EFE6 — warm cream (paper) · Primary / brand: #1F4D3A — board green · Accent (sparingly): #B8743A — copper (the pen) · Neutral / text: #2B2B2B — charcoal · Support: #8FA998 — sage (tables, dividers)\n| Font direction | classic — proposed pairing: Fraunces (heading) / Inter (body) |\n| Logo direction | wordmark for \"The Sunday Table\" + the existing TB monogram, both lockups — for the member's name and the organization name |\n| Tagline (options or the chosen one) | chosen: \"Built on Sundays.\" · parked: \"Here's the routine.\" · \"Show, don't sell.\" |\n\n## Creative direction\n| Mood | A calm, well-kept classroom where the routine is on the board and the door is open. |\n| Energy | 2 — calm and steady, because Taylor's voice is \"warm and patient\" and the agents she attracts are tired of noise |\n| Type | classic — because the Sunday newsletter and the whiteboard are her two references, and her stories are told slowly |\n| Colours | dominant warm cream · support board green · accent copper — because the kitchen table, the whiteboard and the pen are her routine, not a trend (codes in Direction above) |\n| Photos | clean cut-out — because she teaches face-on at a table; nothing moody, nothing shouted |\n| Motifs | 1. the Sunday routine (a numbered 1 · 2 · 3 device) · 2. Austin's quiet neighbourhood streets (the place device, local attractor) · 3. the open table — \"The Sunday Table\" as a long plank or a set place |\n| Avoid | never looks like the brokerage · never a listing flyer · never a tech startup · never a luxury-only brand · never a \"hustle\" aesthetic — no shouting caps, no neon, no stopwatch |\n\n**Reference recipes (three looks, plain names, the first is the Brain's pick):** 1. the warm paper mentor look — because paper, a hand-drawn rule and a taped photo are already how her Instagram reads · 2. the clean editorial leader look — because a serif headline on cream with a green anchor carries authority without volume · 3. the gold-on-black organization look — only for the organization family, in a quieter green-and-copper register, because \"The Sunday Table\" will post welcomes and milestones\n| Tests | authority — the routine is shown, numbered, on the board · relatability — the kitchen table and the real phone photos stay · aspiration — a group with a name and a weekly ritual an agent can picture joining |\n| Member's reaction | confirmed as proposed; moved the copper accent \"a touch warmer\" |\n\n## The Design Package (Week 1) — status\n• [ ] aa-logo-design [refresh mode — scheduled this week] · [ ] aa-style-sheet-design [this week · locked look: not yet] · [ ] aa-brand-kit-design [this week]\n| Kit location | 02 · Brand/ [not yet] — once present, the next Book regenerate shows the kit (logo, palette, type) and attraction-brain-health counts it as a Week 1 item. |\n\n## Design Package brief\nAGENT ATTRACTION DESIGN PACKAGE — Taylor Brooks · issued 2026-10-10\nRun these three Claude Design skills this week, in this order, inside your Brand HQ project:\n1. aa-logo-design — SKIP THIS if you love your logo (use it exactly as-is). Refresh mode: change only this — keep the \"TB\" monogram, drop the little house icon, add a wordmark for \"The Sunday Table\".\n2. aa-style-sheet-design — palette cream #F4EFE6 (dominant) · board green #1F4D3A (brand) · copper #B8743A (accent) · charcoal #2B2B2B (text) · sage #8FA998 (support), fonts classic (Fraunces / Inter proposed), feel \"a well-kept classroom, not a sales floor\", distinct from the brokerage's palette.\n3. aa-brand-kit-design — profile and banner graphics, two logo versions: Taylor Brooks + The Sunday Table.\nBrand name(s): Taylor Brooks + The Sunday Table. Leader brand vs selling brand: same (one brand with a leader lane).\nTagline: \"Built on Sundays.\" Headshots: in 02 · Brand.\nCREATIVE DIRECTION (your Brain derived this; the design skills apply it — you never have to explain it):\nMood: a calm, well-kept classroom where the routine is on the board and the door is open\nEnergy: 2 — calm and steady; the agents she attracts are tired of noise\nType: classic — the Sunday newsletter and the whiteboard are her two references\nColours: dominant warm cream · support board green · accent copper — the kitchen table, the whiteboard and the pen\nPhotos: clean cut-out — she teaches face-on at a table\nMotifs: 1. the Sunday routine (1 · 2 · 3) · 2. Austin's quiet neighbourhood streets · 3. the open table\nAvoid: never looks like the brokerage · never a listing flyer · never a tech startup · never a luxury-only brand · never a \"hustle\" aesthetic — no shouting caps, no neon, no stopwatch\nReference recipes: 1. the warm paper mentor look — paper, a hand-drawn rule and a taped photo are already how her Instagram reads · 2. the clean editorial leader look — a serif headline on cream with a green anchor carries authority without volume · 3. the gold-on-black organization look — the organization family only, in a quieter green-and-copper register\nExamples: uploaded to Brand HQ. Drop anything you have made before, your current Instagram, a logo, or screenshots of brands you admire into your Brand HQ project in Claude Design; the design skills study them for direction and never copy.\nCompliance on every public graphic: brokerage name and license display as compliance.md says.\nUpload your Brain Book as the \"AI Brain file\" when a skill asks for it.\nWhen the kit is finished, drop every file into 02 · Brand so the editor, the thumbnails, and every graphic read it.\n\n## Final kit\n| Logo | not yet · **Colors:** not yet (direction above) · **Fonts:** not yet (direction above) · **Headshot:** 02 · Brand/headshots/taylor-2026.jpg · **Locked look:** not yet (the style sheet locks it) |"}, {"id": "offer", "label": "OFFER", "week": "W2", "state": "built", "title": "Buyers From Open Houses", "tagline": "Your Partner Offer: the program an agent partners with you for, and your own pages on how to build it, where to host it and how to talk about it.", "line": "Named, defined and written. Lives inside The Sunday Table.", "meta": ["Week 2 · built", "Plugin 1 · the Brain’s offer builder", "Demo"], "reads": ["what-you-teach", "your-story", "your-proof", "who-you-help", "your-voice", "your-brokerage"], "actions": [{"p": "refine my partner offer", "n": "Change the name, the steps, the first 30 days, the weekly rhythm. One card, say yes."}, {"p": "paste my compliance link", "n": "Closes the open question on join-gated packages from your brokerage’s own rules."}], "body": ">> I help 2–5 year agents who are paying for leads build a buyer pipeline from the open houses they already host — taught the way a teacher teaches it, one Sunday at a time.\n\n@toc\n## At a glance\n\nThe whole program on one page. The rest of this document is the detail.\n\n| What | Buyers From Open Houses |\n| Program | Buyers From Open Houses — a mentorship program: a weekly call, a 1:1 to start, and me beside you for your first Sunday |\n| For | agents two to five years in, paying for online leads, hosting open houses with the names going into a drawer |\n| The promise | a buyer pipeline from the open houses you already host — with no lead bill |\n| The method | the Five-Step Sunday Routine: Host → Ask → Text → Track → Table |\n| Format | a live weekly group call on Zoom · 1:1 on Zoom · one lesson recorded today, the rest recorded with my first partners · a group chat |\n| Weekly rhythm | the Tuesday table, Tuesdays 9:00 am, 30 minutes · the group chat for Sunday-evening questions · 1:1 on Day 1, your first Sunday, day 30, then once a month |\n| Your first 90 days | Set up (days 1–14) · Run it with me (days 15–30) · Own it (days 31–90): by day 90 the routine runs without me and you have had a first showing from a sign-in |\n| What you get | the two-question sign-in sheet, the five Sunday texts, the tracker, Module 1, the welcome call, me on your first Sunday, the Tuesday table, the group chat, the day-30 check, a monthly 1:1, my organization's teaching call, and everything my brokerage provides |\n| What it costs you | nothing — I teach it to any agent who asks; partnering with me is a separate conversation; the brokerage's own charges are a call, with the documents |\n| Next step | book a call and bring your sign-in sheet — https://book.taylorbrooks.demo/call — or comment ROUTINE for the free guide first |\n\n## Who this is for\n\nYou are two to five years in, doing four to ten deals a year, at a franchise office or on a team inside one. You pay for online leads every month and cannot say where the next closing is coming from.\n\nYou have tried the portal leads, a team that promised leads, and a coaching program whose scripts you dropped in week three. You host open houses, and the sign-in sheets live in a drawer.\n\nIt also fits a career-changer in their first two years — a teacher, a nurse, an office manager — organized, coachable, and unsure where closing number three comes from.\n\nThis is not a lead program — nobody hands you leads; you host the Saturday and you text on the Sunday. This is not a pitch about the brokerage — the model is a separate conversation, on a call, with the documents.\n\n## The promise\n\nI help 2–5 year agents who are paying for leads build a buyer pipeline from the open houses they already host — taught the way a teacher teaches it, one Sunday at a time.\n\nHere is the Tuesday I mean: the invoice for the lead subscription landed on the first, somewhere between eight hundred and fifteen hundred dollars. You hosted an open house on Saturday and eleven people signed in. The sheet is in a drawer, and you are quietly worried this is just what the job is.\n\nIn 2022 I opened a lead invoice in a month I had closed nothing. I'm a former teacher, so I did what teachers do — I sat down at the kitchen table on a Sunday and wrote the lesson I wished someone had given me. Two questions on the sign-in sheet, one text per name by six o'clock, one sheet for the answers, one Tuesday to look at it.\n\nThe next quarter three of those names bought, and I cancelled the leads in December. The routine has run every Sunday since, and it has never cost me a subscription. It works in other hands too: Priya ran it with me from her first Sunday and had three buyers under contract in her first sixty days.\n\nBuyers From Open Houses is the program I built around that routine, for agents who are exactly where I was. It lives inside The Sunday Table, my group. I'd rather show you than tell you.\n\n## The five-step Sunday routine, in five steps\n\nA Saturday open house gives you names, and most agents put them in a drawer. The routine turns the names into a pipeline you own: two questions on the sign-in sheet so Sunday's text has something real to say, one text per name by six o'clock Sunday, every answer on one tracker sheet, and a Tuesday look at the sheet. It happens every Sunday whether you feel like it or not — that is the whole secret, and it costs a Sunday, not a subscription.\n\n| Step | What you do | What you get | The tool or template | Taught in |\n| 1 · Host | host a Saturday open house most weekends — your listing or another agent's | a sheet of names every week, at no cost but a Saturday | the hosting rhythm, taught live; a hosting checklist built with my first partners | Set up · lesson 4, live at the Tuesday table |\n| 2 · Ask | put the two questions on the sign-in sheet and ask them without it feeling like a form | a reason to text each name — their timeline, and what would move them sooner | the two-question sign-in sheet (PDF and Google Doc) | Set up · Module 1, recorded, 12 minutes |\n| 3 · Text | text every name by 6 pm Sunday, one question per text | replies before dinner; the first \"spring, probably\" that becomes a showing | the five Sunday text scripts | Run it with me · lesson 2, live on your first Sunday |\n| 4 · Track | put every answer on one sheet, one row per name | your whole pipeline on one screen; nothing to subscribe to | the tracker sheet (Google Sheet template) | Run it with me · lesson 3, live on your first Sunday |\n| 5 · Table | bring the sheet to the Tuesday table and say who you are calling this week | one thing to do each week that gets you a client, and someone who saw your sheet | the Tuesday table (30 minutes, Zoom) | Own it · every Tuesday |\n\nOne line: Host → Ask → Text → Track → Table — a Saturday, two questions, five texts, one sheet, one Tuesday.\n\n## Inside buyers from open houses: your first 90 days\n\nThree phases over ninety days, then it keeps going. Only Module 1 is recorded today; the rest is taught live and recorded with my first partners.\n\n| Phase | Days | Live | Recorded | Steps | Ends with |\n| Set up | 1–14 | the 45-minute welcome call, 1:1 on Zoom · the group chat and the Tuesday table from the same day | Module 1 — the two-question sign-in sheet, 12 minutes | Host · Ask | the sheet, the five texts and the tracker in your hands, and your first open house on the calendar within 14 days |\n| Run it with me | 15–30 | me on Zoom for your first Sunday, 30 minutes · you present your sheet at the Tuesday table · the day-30 check | lessons 2 and 3 — recorded with my first partners | Text · Track | three Sundays run; every name has one text and one tracker row; a first showing from a sign-in, or the honest reset conversation |\n| Own it | 31–90 | the Tuesday table every week · one 20-minute 1:1 a month · your second and third open-house cycles | lessons 4 and 5 — recorded with my first partners | Table, and Host to Track without me | the routine runs without me; you have presented your sheet twice; a first buyer under contract from a sign-in, or a reset with a new Saturday plan |\n| Then — the partnership | month 4 on | the Tuesday table, the group chat, the monthly 1:1 · you teach the next person at the table | — | all five, taught forward | ongoing — a partner's win named every Tuesday |\n\nThe first three lessons:\n| Lesson | After this you can | What's on screen | Template handed over | Run time |\n| 1 · The two-question sign-in sheet | host Saturday with a sheet that gives Sunday something to say | the sheet at my kitchen table; the two questions, and why nobody minds them | the sign-in sheet (PDF and Google Doc) | 12 minutes, recorded |\n| 2 · The five Sunday texts | text every sign-in by 6 pm Sunday with one question each | my phone — the five scripts, and which one fits which answer | the five text scripts | 30 minutes, live on your first Sunday; recorded with my first partners |\n| 3 · The tracker and the Tuesday look | see your whole pipeline on one sheet and know who to call on Tuesday | the Google Sheet — one row per name, the timeline column | the tracker sheet | 15 minutes, live on your first Sunday; recorded with my first partners |\n\nThe rest:\n• Lesson 4 — Hosting a Saturday that fills the sheet: getting listings to host when you have none, and asking the two questions out loud. Live at the Tuesday table in Set up; recorded with my first partners.\n• Lesson 5 — The reset conversation: what to do when a Sunday produces nothing, and how to plan the second Saturday. Live at the day-30 check; recorded with my first partners.\n\n## What you get when you partner with me\n\nI teach the routine to any agent who wants to learn it; partnering with me is a separate conversation. My own things first, then my organization's, then the brokerage as one line; every row is real today or says it gets built with my first partners.\n\n### From me\n\n| What | What it is | Format | Exists today? |\n| The two-question sign-in sheet | the sheet with the two questions on it — \"What's your timeline?\" and \"What would make you move sooner?\" | PDF and Google Doc | yes |\n| The five Sunday text scripts | one text per situation, one question each | a text file, pinned in the group chat | yes |\n| The tracker sheet | every answer, one row per name, with the timeline column | Google Sheet template | yes |\n| Module 1 — the two-question sign-in sheet | the first lesson: me at the kitchen table with the sheet on camera | recorded video, 12 minutes | yes |\n| The welcome call | your Day 1 1:1 — the sheet, the texts and the tracker handed over | 45 minutes, Zoom | yes |\n| Me on your first Sunday | the routine run together, on your first real sheet | 30 minutes, Zoom, 1:1 | yes |\n| The Tuesday table | the weekly group call — one real sheet, the five steps run live | 30 minutes, Tuesdays 9:00 am, Zoom | yes — every week since September 2026 |\n| The group chat | three people today; Sunday-evening questions | group text | yes |\n| The day-30 check and the monthly 1:1 | three Sundays reviewed, the texts adjusted; then twenty minutes a month | Zoom, 1:1 | yes |\n| The Five-Step Sunday Routine guide | the sheet, the five texts and the tracker in one short guide | PDF plus the Google Sheet template | built with my first partners |\n| Lessons 2 to 5, recorded | the five texts · the tracker · hosting a Saturday · the reset conversation | video | built with my first partners |\n\n### From my organization\n\n| What | What it is | Format | Exists today? |\n| Jordan's Tuesday teaching call | my upline's weekly call for the whole organization — an agent presents what worked that week; I'll introduce you in your first week | live, Zoom | yes |\n| Jordan on a three-way call | the model walked through with the real documents; I'll set it up whenever you want it | 30 minutes, Zoom | yes |\n\nAnd everything my brokerage provides — I walk you through that on a call, with the real documents.\n\n## Your first 30 days\n\nDay 1 is one call and five things that come out of it. The four weeks after it each end with something you can point to.\n\n### Day 1\n\n1. The welcome call — forty-five minutes on Zoom. Bring your last sign-in sheet, or a blank one; we start from your Saturday, not mine.\n2. The setup — the two-question sheet, the five texts and the tracker are handed over, and the tracker is copied into your own Google Drive before we hang up.\n3. The first lesson — we watch Module 1 together on the call, twelve minutes, with the sheet on screen.\n4. The group — you are added to the group chat and sent the Tuesday table invite the same day, and I introduce you at the next table.\n5. The calendar — your first open house is dated before the call ends, inside the next fourteen days. No listing to host? That is lesson four, and we solve it on the call.\n\n| Week | You | Me | Done when |\n| 1 | the welcome call; Module 1; book the first open house | the 45-minute call; hand over the sheet, the five texts and the tracker | the first open house is on the calendar within 14 days |\n| 2 | host the open house; text every sign-in by 6 pm Sunday | sit in on your Sunday routine on Zoom, 30 minutes | every name has one text and one tracker row |\n| 3 | the second open house; the first \"what's your timeline\" replies land | you present your sheet at the Tuesday table | one conversation booked with a sign-in |\n| 4 | run the routine without me; a showing, or an honest reset | the day-30 check: three Sundays run; we adjust the texts | a first showing from a sign-in, or the reset conversation |\n\nDone when: three Sundays have run · every name has one text and one tracker row · you have had a first showing from a sign-in, or we have had the honest reset conversation and planned the next Saturday.\n\nA Sunday that produces nothing is data on the sheet, not a failure. Marcus's first Sunday had eleven names and no showing; his third week had the showing.\n\n## How we work together\n\nThe Tuesday table: Tuesdays at 9:00 am, thirty minutes, on Zoom, link in the group chat. One partner brings a real sign-in sheet and the group runs the five steps on it, live.\n\nThe group chat: three people today — me, Priya and Marcus. Sunday-evening questions about a sheet, a text that landed, a showing booked.\n\nYour 1:1 time: the welcome call on Day 1 · me on Zoom for your first Sunday · the day-30 check · then one twenty-minute 1:1 a month.\n\nWhat you can expect from me: same-day replies on weekdays, and Sunday evening for anything about a sign-in sheet. Nothing after 7 pm — family dinner is the hard stop.\n\nWho else is in the room: Jordan, my upline, hosts the organization's Tuesday teaching call and takes the three-way call on the model. That is Jordan's, and I say so.\n\nThe rhythm: a partner's win named every Tuesday · the day-30 check for every new partner · the monthly 1:1 · the Sunday streak, the only thing I will ever hold you to.\n\nPROOF\n\nWhat I can point to, in the words I use on a call. Every figure is my own tracking, and every partner's result is theirs.\n\n• My own routine: about twenty closings a year in each of the last two years, roughly sixty percent traceable to an open-house sign-in; about one buyer client per two open houses hosted since the Sunday routine started.\n• Priya — three years in, open houses every weekend, never once texted a sign-in on a Sunday: three buyers under contract in her first sixty days. I say this on calls; her written OK comes before it goes in print.\n• Marcus — a brand-new agent in September: hosted two open houses, texted all eleven of his first-Sunday sign-ins, and booked his first showing from a sign-in in week three. In his words: \"I thought I needed leads. Turns out I needed Sunday.\"\n• The organization today: two agents, both running the routine.\n• My upline's proof, labeled as theirs: the organization's Tuesday teaching call — I can show you a recording on a call — and Jordan on the three-way call.\n\n## Why now\n\nEvery month you wait is another invoice, and the routine takes one Sunday to start. That is the honest reason, and the only one about you.\n\nThe one that is about me: I am taking my first five partners this quarter. At the table's size today every partner presents their own sheet and gets me on Zoom for their first Sunday.\n\nAt twenty-five partners that will not be true in the same way — partners will be teaching partners, which is the plan. If you want the version where I sit next to you for the first three Sundays, this quarter is that version.\n\n## Your next step\n\nBook a call with me — https://book.taylorbrooks.demo/call — and bring your sign-in sheet. Thirty minutes, about your business; I'll bring the five texts.\n\nWhat the call is: a lesson on your own sheet, and your questions answered straight. What the call is not: a pitch — the model is a second conversation, with the documents, if you want it.\n\nWant the routine first? Comment ROUTINE on any of my posts and I'll send the free guide before we talk.\n\nIf we both decide this is the right table for you, Day 1 is one welcome call, and your first open house is on the calendar before we hang up.\n\nCompensation isn't on this page on purpose — it's a private, brokerage-approved conversation. Before this goes anywhere public, check your brokerage's advertising and rev-share marketing rules.\n\n## Appendix — for my content\n\nMy own page — the lines I say and post, and the choices this document made for me. Not for an agent. Every line leads with what I teach, my story and how I mentor.\n\n### The four ways to say it\n\nThe promise: \"I help 2–5 year agents who are paying for leads build a buyer pipeline from the open houses they already host — taught the way a teacher teaches it, one Sunday at a time.\"\nOutcome-led: \"A buyer pipeline from the open houses you already host — with no lead bill.\"\nStory-led: \"I paid for leads in a month I closed nothing. Then I built the Sunday routine. Now I teach it.\"\nMechanism-led: \"Two questions on the sign-in sheet, five texts by six on Sunday, one sheet on Tuesday. That's the system.\"\n\n### The 30-second explanation\n\nI help agents who are two to five years in and paying for leads build a buyer pipeline from the open houses they already host. Two questions on the sign-in sheet, one text per name by six on Sunday, every answer on one sheet, and a Tuesday look at it with the group. I'm a former teacher, so I teach it the way a teacher would — step one first, then why. Want to see it? Bring your last sign-in sheet; I'll bring the five texts.\n\n### The short lines\n\nDM: \"I built the routine that replaced my lead bill. Want the sheet?\"\nCaption: \"Open houses plus one Sunday. That's the whole system. Happy to show you.\"\nBio: \"Not a pitch — a lesson. Thirty minutes, your sign-in sheet, my five texts.\"\nVideo intro: \"Here's the routine that replaced my lead bill — two questions, five texts, one Sunday.\"\n\nComment keyword: ROUTINE — \"Comment ROUTINE and I'll send it.\"\n\nThe free guide is cut from: steps 2 to 4 — Ask, Text, Track — the sheet, the five texts and the tracker, the steps an agent can run this Sunday without me; partners get all five, taught live. The live guide is The Five-Step Sunday Routine, keyword ROUTINE.\n\n### What I assumed (change any of these)\n\n• The program type: mentorship program — a weekly call plus a 1:1 to start is what you run today.\n• The program name: Buyers From Open Houses — the outcome plus the Saturday that produces it, in an agent's words; the alternates were The Open House to Buyer System and Five Texts to Your Next Buyer. The Sunday Table stays your group's name — the program lives inside it.\n• The method's name: the Five-Step Sunday Routine — your own phrase since October 2022.\n• The weekly call: Tuesdays at 9:00 am, 30 minutes, Zoom — from how you run it today.\n• Recorded vs live: Module 1 recorded; lessons 2 to 5 live, recorded with your first partners — from what exists on file today.\n• The support rhythm: same day on weekdays, Sunday evening for a sign-in sheet, nothing after 7 pm — from your response commitment and the dinner rule.\n• The 90-day outcome: the routine running without you and a first showing from a sign-in — the path Priya ran.\n• The first lesson: the two-question sign-in sheet — the thing you can put on camera tonight.\n• What it costs you: nothing — you teach it to any agent who asks while your brokerage's rule on packages is checked; the brokerage's own charges are a call.\n• The comment keyword: ROUTINE — coined from the routine; it never changes once content has used it.\n• The brokerage rule: being checked — the inducement rules are not yet reviewed, so every public line leads with what you teach, your story and your mentorship until the desk confirms.\n\n## How to create it\n\nMost of this exists. Here is what to record, what to write, and what the first month asks.\n\nRecord:\n• Module 1, the two-question sign-in sheet — done, reuse it.\n• Lesson 2, the five Sunday texts — live on a partner's first Sunday; record the next one, phone on screen.\n• Lesson 3, the tracker and the Tuesday look — live on the same Sunday; record it the same way.\n• Lessons 4 and 5 — live at the table and at the day-30 check; recorded with my first partners, not before.\n\nWrite:\n• The sign-in sheet, the five texts, the tracker — done, reuse them; one folder a partner copies on Day 1.\n• The welcome-call agenda — one page: your last sheet, the three files, Module 1, the first open house dated.\n• The Day 1 hand-over list — the sheet, the texts, the tracker, the chat invite, the Tuesday invite.\n• The welcome post — who this is for, what happens on Tuesdays, where the files live.\n\nThe first 30 days, my side:\n• Week 1 — the 45-minute welcome call; the files handed over; the first open house dated.\n• Week 2 — thirty minutes on Zoom for the partner's first Sunday.\n• Week 3 — the partner presents their sheet at the Tuesday table.\n• Week 4 — the day-30 check: three Sundays reviewed, the texts adjusted.\n\nThe weekly touchpoint: the Tuesday table — Tuesdays at 9:00 am, thirty minutes, Zoom, one real sheet, the five steps run live. When I cannot host, I move it the same day; it never skips a week.\n\n## Start with your upline\n\nMike's rule for a newer attractor: use your upline's package and your own skill to get started; build your own over time. Jordan's package carried my first two partners while the routine proved itself.\n\nMy upline's package: Jordan's Tuesday teaching call for the whole organization — an agent presents what worked that week · Jordan on a three-way call, the model walked through with the real documents. Both are Jordan's, and I say so.\n\nMy own skill added to it: the two-question sign-in sheet and the five Sunday texts — the one lesson I could teach on day one.\n\nThe offer I could run with nothing else: Jordan's call and three-way, plus my Sunday routine taught at a kitchen table.\n\nThe three signs you are ready to build your own:\n• Agents have asked for your way of doing something — true today: Priya sat in on three Tuesday tables before she asked, and Marcus's instructor sent him to go find the teacher.\n• Your process has a result you can stand behind — true today: about one buyer per two open houses since the routine started, my own tracking.\n• Your upline's package does not serve who your story speaks to — true today: Jordan's call and three-way are about the model; the agent my story speaks to needs a Saturday and a Sunday first, not a model conversation.\n\nVerdict: all three — this program is mine, and Jordan's package is a layer inside it, labeled as Jordan's.\n\n## If your brokerage does not allow a join-gated package\n\nRule in force: being checked. My compliance file says the inducement rules are not yet reviewed, and my model file holds nothing on it — so these pages are written the safe way until it confirms.\n\nWhat it means for the words: until it is confirmed, what I put in public is what I teach, my story and how I mentor — the Sunday routine, taught to any agent who wants it. Partnering with me is a separate conversation, on a call. Nothing public makes the sheet and the texts a reason to join.\n\nThe lines that change:\n• The for-line and the promise — agents paying for leads who host open houses; the routine, not a bundle.\n• What it costs you — nothing; I teach it to any agent who asks.\n• The four ways to say it and the short lines — what I teach, what happened to me, how I mentor.\n• The funnel's offer and why-join-me sections — the lesson and the table, not a package.\n• The bios — former teacher, the routine, the free guide; no package.\n\nThe check: ask the compliance desk whether a package may be offered as a reason to join. If yes, the \"what it costs you\" row and the sneak peek go back to \"it comes with the partnership\"; if no, these pages are already right.\n\n## Where to host it\n\nRecommended: Skool — the easiest. One community; the classroom holds Module 1 and the three files; the calendar holds the Tuesday table; one welcome post pinned at the top.\n\nThe alternative: Circle — the same four things, a little more to configure.\n\nYour community's name: The Sunday Table — the name already on the group, the Tuesday call and the channel. The program lives inside it.\n\nSet up in 20 minutes:\n• Create the community and name it The Sunday Table.\n• Add Module 1, the sheet, the five texts and the tracker to the classroom.\n• Put the Tuesday table on the calendar, 9:00 am, with the Zoom link.\n• Write the welcome post — who this is for, what happens on Tuesdays, where the files live.\n\nKeep it simple: one community, one welcome post, one weekly call.\n\nThe group chat: stays the chat, for Sunday-evening questions.\n\nSkool — the cohort's link is in your Week 2 materials.\n\n## Your content branches\n\nEverything I post is a branch of the one thing I help agents do — build a buyer pipeline from the open houses they already host. One segment at a time, tactical and specific; never the whole routine in one video.\n\nHosting a Saturday that fills the sheet: how to get a listing to host when you have none · the two questions, asked out loud without it feeling like a form · what to do with eleven names at 4 pm.\n\nThe Sunday follow-up: the text that gets a reply before dinner · which of the five texts fits \"spring, probably\" · why 6 pm Sunday and not Monday morning.\n\nTracking without a CRM: the one-sheet tracker, row by row · the timeline column that tells you who to call · what to look at every Tuesday.\n\nWhat agents pay for versus what works: a lead bill versus a Saturday, in activities not dollars · the subscription cancelled in December 2022 and what replaced it · what a drawer full of sign-in sheets is worth.\n\nThe Sunday at the kitchen table: the invoice in a month with no closing · the legal pad and the first five texts · the three names that bought the next quarter.\n\nTeaching it the way a teacher teaches it: step one before why · the sheet does the convincing · what Priya's first Sunday looked like, with her OK on file first.\n\nMy Week 3 and Week 4 content plans build their pillars and titles from these six first."}, {"id": "lead-magnet", "label": "LEAD MAGNET", "week": "W2", "state": "now", "title": "Your lead magnet and its funnel", "tagline": "The Five-Step Sunday Routine, written. The funnel is not live yet.", "line": "The guide is written. Design, the page and delivery are left.", "meta": ["Week 2 · this week", "Plugin 3 · Lead Magnets & Opt-In Funnels", "Demo"], "reads": ["offer", "what-you-teach", "who-you-help", "your-story", "your-proof", "your-voice"], "actions": [{"p": "finish my agent lead magnet", "n": "Picks up exactly where this campaign stopped."}, {"p": "design brief for my guide", "n": "The brief for the styled PDF, the cover and the 3D mockup, for Claude Design."}, {"p": "deliver my guide", "n": "The keyword flow for ManyChat, the delivery email, and the story that offers it."}], "body": ">> By the end of this week you have ONE lead magnet, written and designed, with its funnel outline — and your unique value proposition broken down: your offer explained in detail and how to create it, its name, the marketing language to use, and where to host it.\n@note: Mike’s words for Week 2.\n\n## Where it stands\n@status: Your Partner Offer | done | Buyers From Open Houses\n@status: ONE lead magnet recommended; you said yes | done | The Five-Step Sunday Routine\n@status: The guide, written | done | \n@status: The guide, designed in Claude Design | soon | \n@status: The opt-in page, live | soon | the outline is the copy; the design keys on it\n@status: Delivery: the keyword flow, the delivery email, the 3-frame story | soon | \n\n## The guide\n| Name | The Five-Step Sunday Routine |\n| Keyword | ROUTINE — “Comment ROUTINE and I’ll send it.” It never changes once content has used it. |\n| For | — |\n| Funnel | not live yet |\n| Download | not live yet |\n\n## The funnel outline: the opt-in page, in the order it reads\n1. Hero — the pre-headline, your video, the attraction line, and the opt-in button.\n2. Problem — the pain in the agent’s own words.\n3. Product — the guide and what’s inside; the opt-in button again.\n4. Who I am.\n5. Journey — your story, the turning point.\n6. Offer — what you teach and your weekly call, in the register your brokerage allows.\n7. Why join me — the lesson and the mentorship, never a package.\n8. Proof — your results as your Brain states them; a partner’s result only with their written OK.\n9. The organization — what you do together, and who’s in it.\n10. Book a call — the second path, for the agent who is already ready.\n11. Opt-in — the last button, the same words every time.\n\nEvery opt-in button opens the one pop-up (first name, email, phone). Submitting lands on the thank-you page with the instant download and the invitation to a call. The compliance stamp is the footer of both."}, {"id": "short-form", "label": "SHORT-FORM", "week": "W3 const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const parts=s=>s.split(' | ').map(x=>x.trim());
const ICON={done:'✓',now:'◐',soon:'○',built:'✓'};
const title=s=>s.charAt(0)+s.slice(1).toLowerCase();

function table(rows){
  if(!rows.length) return '';
  if(rows.every(r=>r.length===2)) return '<dl class="kv">'+rows.map(r=>'<div><dt>'+inl(r[0])+'</dt><dd>'+inl(r[1])+'</dd></div>').join('')+'</dl>';
  const h=rows[0], b=rows.slice(1);
  return '<div class="tw"><table><thead><tr>'+h.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function statusList(it){
  return '<ul class="status">'+it.map(p=>{const label=p[0],state=p[1]||'soon',note=p[2]||'';return '<li class="'+esc(state)+'"><span class="ic">'+(ICON[state]||'○')+'</span><div><div class="sl">'+inl(label)+'</div>'+(note?'<div class="sn">'+inl(note)+'</div>':'')+'</div></li>';}).join('')+'</ul>';
}
function swatches(it){
  return '<div class="swatches">'+it.map(p=>'<div class="sw"><span class="chipc" style="background:'+esc(p[0])+'"></span><div><div class="sl">'+inl(p[1])+'</div><div class="sn">'+esc(p[0])+' · '+inl(p[2]||'')+'</div></div></div>').join('')+'</div>';
}
function systemsList(){
  return '<ul class="status">'+OUTER.map(d=>'<li class="'+d.state+'"><span class="ic">'+ICON[d.state]+'</span><div><div class="sl"><button type="button" class="doclink" data-doc="'+d.id+'">'+esc(title(d.label))+'</button><span class="wk">WEEK '+d.week.slice(1)+'</span></div><div class="sn">'+inl(d.line)+'</div></div></li>').join('')+'</ul>';
}
function phraseBits(o){
  if(o.phrase) return '<code>'+esc(o.phrase)+'</code><button type="button" class="copy" data-copy="'+esc(o.phrase)+'">copy</button>';
  return o.how?'<span class="sn" style="font-size:13px;color:var(--muted)">'+inl(o.how)+'</span>':'';
}
function phraseRow(o){const b=phraseBits(o);return b?'<div class="om">'+b+'</div>':'';}
function openList(){
  const rows=OPEN.map((o,i)=>({o,i})),left=rows.filter(r=>!doneOpen.includes(r.i)),done=rows.filter(r=>doneOpen.includes(r.i));
  const item=r=>{const d=DOCS[r.o.node],dn=doneOpen.includes(r.i);return '<li class="'+(dn?'done':'')+'"><div><div class="ot">'+inl(r.o.text)+'</div><div class="om"><span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)">On</span><button type="button" class="doclink" data-doc="'+r.o.node+'">'+esc(d.title)+'</button><button type="button" class="copy mark" data-oi="'+r.i+'">'+(dn?'undo':'mark done')+'</button></div>'+(dn?'':phraseRow(r.o))+'</div></li>';};

function changedHTML(){return '<ul class="status">'+Object.keys(CHANGED).map(id=>{const d=DOCS[id];return '<li class="now"><span class="ic">◐</span><div><div class="sl"><button type="button" class="doclink" data-doc="'+id+'">'+esc(d.title)+'</button></div><div class="sn">'+inl(CHANGED[id])+'</div></div></li>';}).join('')+'</ul>';}
function bar(label,v,t){const w=Math.max(0,Math.min(100,Math.round(v/t*100)));return '<div class="bar"><div class="bl"><span>'+esc(label)+'</span><span><b>'+v+'</b> of '+t+' · day 90</span></div><div class="bt"><div class="bf" style="width:'+w+'%"></div></div></div>';}

function render(text,id){
  const lines=text.split('\n');let out=[],para=[],i=0;
  const flush=()=>{if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[];}};
  const isT=l=>l.startsWith('|');
  while(i<lines.length){
    const l=lines[i].trim();
    if(!l){flush();i++;continue;}
    if(l.startsWith('### ')){flush();out.push('<h4>'+inl(l.slice(4).trim())+'</h4>');i++;continue;}
    if(l.startsWith('## ')){flush();const t=l.slice(3).trim();out.push('<h3 id="h-'+id+'-'+slug(t)+'">'+inl(t)+'</h3>');i++;continue;}
    if(isT(l)){flush();const rows=[];while(i<lines.length&&isT(lines[i].trim())){const r=lines[i].trim();if(!/^\|\s*-+/.test(r))rows.push(r.slice(1,-1).split('|').map(c=>c.trim()));i++;}out.push(table(rows));continue;}
    if(l.startsWith('>> ')){flush();out.push('<blockquote>'+inl(l.slice(3))+'</blockquote>');i++;continue;}
    if(/^• /.test(l)){flush();const it=[];while(i<lines.length&&/^• /.test(lines[i].trim())){it.push(lines[i].trim().slice(2));i++;}out.push('<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');continue;}
    if(/^\d+\.\s+/.test(l)){flush();const it=[];while(i<lines.length&&/^\d+\.\s+/.test(lines[i].trim())){it.push(lines[i].trim().replace(/^\d+\.\s+/,''));i++;}out.push('<ol>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>');continue;}
    if(l.startsWith('@status:')){flush();const it=[];while(i<lines.length&&lines[i].trim().startsWith('@status:')){it.push(parts(lines[i].trim().slice(8)));i++;}out.push(statusList(it));continue;}
    if(l.startsWith('@swatch:')){flush();const it=[];while(i<lines.length&&lines[i].trim().startsWith('@swatch:')){it.push(parts(lines[i].trim().slice(8)));i++;}out.push(swatches(it));continue;}
    if(l.startsWith('@note:')){flush();out.push('<p class="note">'+inl(l.slice(6).trim())+'</p>');i++;continue;}
    if(l.startsWith('@link:')){flush();const p=parts(l.slice(6));out.push('<p><button type="button" class="doclink" data-doc="'+esc(p[0])+'">'+inl(p[1]||'Open')+' →</button></p>');i++;continue;}
    if(l==='@toc'){flush();out.push('<!--TOC-->');i++;continue;}
    if(l==='@systems'){flush();out.push(systemsList());i++;continue;}
    if(l==='@openlist'){flush();out.push(openList());i++;continue;}
    if(l==='@tracker'){flush();out.push(trackerBlock());i++;continue;}
    if(l==='@moves'){flush();out.push(movesHTML());i++;continue;}
    if(l==='@week'){flush();out.push(weekHTML());i++;continue;}
    if(l==='@changed'){flush();out.push(changedHTML());i++;continue;}
    para.push(l);i++;
  }
  flush();
  let html=out.join('\n');
  if(html.includes('<!--TOC-->')){
    const hs=[];html.replace(/<h3 id="([^"]+)">(.*?)<\/h3>/g,(m,a,b)=>{hs.push([a,b]);return m;});
    html=html.replace('<!--TOC-->','<div class="toc">'+hs.map(h=>'<button type="button" data-jump="'+h[0]+'">'+h[1]+'</button>').join('')+'</div>');
  }
  return html;
}

function showRel(d){
  clearRel();
  let ids=d.feeds||d.reads||[];
  if(d.id==='open-items')ids=Array.from(new Set(openLeft().map(x=>x.o.node)));
  if(d.id==='goals')ids=['your-numbers','ai-admin','conversion'];
  const ox=d._x!=null?d._x:CX,oy=d._y!=null?d._y:CY;
  ids.forEach(id=>{const t=DOCS[id];if(!t||!t._el)return;t._el.classList.add('rel');if(reduce)return;el('line',{x1:ox,y1:oy,x2:t._x,y2:t._y,class:'rel-line'+(d.state==='now'?' now':'')},rel);});
}
let toastT=0;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('resetDemo').addEventListener('click',()=>{LS.del('moves:'+DAY);LS.del('open:'+D.STAMP);doneMoves=[];doneOpen=[];renderMoves();renderOpenState();toast('Checkmarks reset');});

/* search: pages, and what to say */
const INDEX=Object.values(DOCS).map(d=>({id:d.id,title:d.title,text:((d.tagline||'')+' '+d.body.replace(/^@.*$/gm,' ').replace(/[|#>]+/g,' ')+(d.id==='open-items'?' '+OPEN.map(o=>o.text).join(' '):'')+(d.id==='today'?' '+MOVES.join(' ')+' '+WEEK.map(w=>w.t).join(' '):'')).replace(/\s+/g,' ').trim()}));
const PHRASES=[];(function(){const seen=new Set();Object.values(DOCS).forEach(d=>(d.actions||[]).forEach(a=>{if(!seen.has(a.p)){seen.add(a.p);PHRASES.push({id:d.id,p:a.p,n:a.n});}}));})();
function snippet(text,v,i){const s=Math.max(0,i-60),e=Math.min(text.length,i+v.length+90);return (s>0?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+v.length))+'</mark>'+esc(text.slice(i+v.length,e))+(e<text.length?'…':'');}
const qIn=document.getElementById('q'),qRes=document.getElementById('qres');
function doSearch(){
  const v=qIn.value.trim().toLowerCase();
  if(v.length<2){qRes.hidden=true;qRes.innerHTML='';return;}
  const pages=INDEX.map(x=>{const i=x.text.toLowerCase().indexOf(v),inT=x.title.toLowerCase().includes(v);return (inT||i>=0)?{x,i,inT}:null;}).filter(Boolean).sort((a,b)=>(b.inT?1:0)-(a.inT?1:0)).slice(0,6);
  const ph=PHRASES.filter(a=>(a.p+' '+a.n).toLowerCase().includes(v)).slice(0,4);
  let h='';
  if(pages.length)h+='<div class="qh">Pages</div>'+pages.map(r=>'<button type="button" class="qr" data-doc="'+r.x.id+'"><b>'+esc(r.x.title)+'</b><span>'+(r.i>=0?snippet(r.x.text,v,r.i):esc(r.x.text.slice(0,120))+'…')+'</span></button>').join('');
  if(ph.length)h+='<div class="qh">What to say in Cowork</div>'+ph.map(a=>'<button type="button" class="qr ph" data-doc="'+a.id+'" data-copy="'+esc(a.p)+'"><code>'+esc(a.p)+'</code><span>'+esc(a.n)+'</span></button>').join('');
  if(!h)h='<div class="qn">Nothing in your Brain matches that yet.</div>';
  qRes.innerHTML=h;qRes.hidden=false;
  qRes.querySelectorAll('.qr').forEach(b=>{b.onclick=()=>{if(b.dataset.copy){try{navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('Copied: '+b.dataset.copy)).catch(()=>toast('Select the phrase on the page to copy it'));}catch(e){}}openDoc(b.dataset.doc,qIn,{q:b.dataset.copy?null:v});qRes.hidden=true;};});
}
let qT=0;qIn.addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(doSearch,120);});
qIn.addEventListener('focus',()=>{if(qIn.value.trim().length>=2)doSearch();});
qIn.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=qRes.querySelector('.qr');if(f)f.click();}if(e.key==='Escape'){qIn.value='';qRes.hidden=true;}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))qRes.hidden=true;});

renderMoves();renderOpenState();

/* deep link */
const h=(location.hash||'').slice(1);
if(h&&DOCS[h])openDoc(h);

/* background: a slow particle field */
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');let pts=[],raf=0,W=0,H=0;
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
  const n=Math.min(110,Math.floor(innerWidth*innerHeight/11000));
  pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18*devicePixelRatio,vy:(Math.random()-.5)*.18*devicePixelRatio}));}
function tick(){
  ctx.clearRect(0,0,W,H);const L=130*devicePixelRatio;
  for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
  ctx.lineWidth=1;
  for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<L){ctx.strokeStyle='rgba(43,216,138,'+((1-d/L)*.16).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
  ctx.fillStyle='rgba(142,243,198,.5)';
  for(const p of pts){ctx.beginPath();ctx.arc(p.x,p.y,1.3*devicePixelRatio,0,Math.PI*2);ctx.fill();}
  raf=requestAnimationFrame(tick);
}
if(!reduce){size();tick();addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else tick();});}
})();
</script>
