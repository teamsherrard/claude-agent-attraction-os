<title>Taylor’s Brain Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Rendered by shared/render_board.py — never edit the output by hand; edit this template. Layout: a four-tile strip (goals · today · this week · open items) over the map. The map is the Brain: the member in the centre, the nine parts of their Brain as the inner ring, the weekly systems as the outer ring. Every dot, tile and the centre opens the same right-hand document panel, filled from the member's own Brain files. Dark-only by design. */
:root{
  --bg:#070B12; --fg:#F2F5FA; --muted:#B9C3D1; --dim:#8E9AAC; --line:rgba(255,255,255,.09);
  --accent:#2BD88A; --accent2:#8EF3C6; --amber:#F2B84B; --panel:#0E141F; --panel2:#0A1019; --code:rgba(0,0,0,.45);
  --display:'Sora',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --pw:min(700px,54vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;font-weight:500;line-height:1.5;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;transition:margin .32s ease,max-width .32s ease}
body.open .wrap{margin-right:var(--pw);max-width:none}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 0}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.name{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:13px;letter-spacing:.03em;padding:8px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(7,11,18,.6)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:8px;vertical-align:1px}
button.chip{cursor:pointer}
button.chip:hover{border-color:rgba(43,216,138,.5);color:var(--fg)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0 4px}
@media (min-width:981px){body.open .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1700px){body.open .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{text-align:left;min-width:0;padding:14px 16px 15px;border-radius:16px;border:1px solid var(--line);background:rgba(14,20,31,.72);cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:border-color .2s,transform .2s;backdrop-filter:blur(6px)}
.tile:hover{border-color:rgba(43,216,138,.5);transform:translateY(-1px)}
.tile.amber:hover,.tile.amber.active{border-color:rgba(242,184,75,.6)}
.tile.active{border-color:rgba(43,216,138,.6)}
.tile .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
.tile .k .r{color:var(--dim);letter-spacing:.04em;text-transform:none}
.tile.amber .k{color:var(--amber)}
.tile .big{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.28;text-wrap:balance}
.tile .small{font-size:15px;color:var(--muted);line-height:1.45}
.tile ol{margin:0;padding-left:18px;font-size:15px;color:var(--fg);line-height:1.4;display:flex;flex-direction:column;gap:3px}
.tile .coderow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile code{font-family:var(--mono);font-size:14px;background:var(--code);padding:5px 9px;border-radius:7px;color:var(--accent2);display:inline-block;max-width:100%;white-space:normal;word-break:break-word;line-height:1.4}
.ring{display:flex;align-items:center;gap:12px}
.ring svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
.ring .rfg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(43,216,138,.6))}
.ring .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
.ring .l{font-size:14px;color:var(--muted);line-height:1.3}
.mini{display:flex;flex-direction:column;gap:5px}
.mb{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mb .lab{display:flex;justify-content:space-between;gap:6px;min-width:0}
.mb .lab b{color:var(--fg);font-weight:500}
.mb .t{height:6px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
.mb .f{height:100%;background:var(--accent);border-radius:2px}
.tile .n2{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.tile .n2 span{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin-left:6px}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0 0}
#map{width:min(100%,calc(70vh * 1.111));max-width:1000px;height:auto;display:block;overflow:visible}

.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--dim);padding:2px 0 10px}
.legend .on{color:var(--accent2)}.legend .now{color:var(--amber)}.legend .op{color:var(--amber)}
.chips{display:none;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 0 14px}
.chips .chlab{width:100%;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.chips button{font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chips button.now{border-color:rgba(242,184,75,.5);color:var(--amber)}
.chips button.soon{color:var(--dim)}
.foot{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--dim);padding:0 0 26px;line-height:1.6}

/* SVG map */
.rng{fill:none;stroke:rgba(43,216,138,.18);stroke-dasharray:2 7;transform-box:fill-box;transform-origin:center;animation:spin 150s linear infinite}
.rng.outer{stroke:rgba(142,243,198,.16);animation-duration:240s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.web{stroke:rgba(142,243,198,.14);stroke-width:1;fill:none}
.spoke{stroke:rgba(43,216,138,.4);stroke-width:1.4;fill:none}
.spoke.soon{stroke:rgba(142,243,198,.3);stroke-dasharray:3 6}
.spoke.now{stroke:rgba(242,184,75,.65);stroke-dasharray:4 5}
.node{cursor:pointer;outline:none}
.node .halo{fill:var(--accent);opacity:.14;transition:opacity .2s}
.node .dot{fill:var(--accent);filter:url(#glow)}
.node.soon .dot{fill:#17202E;stroke:rgba(142,243,198,.7);stroke-width:2;filter:none}
.node.soon .halo{opacity:.06}
.node.now .dot{fill:var(--amber)}
.node.now .halo{fill:var(--amber)}
.node:hover .halo,.node:focus-visible .halo,.node.active .halo{opacity:.36}
.node.soon:hover .halo,.node.soon.active .halo{opacity:.2}
.node.active .ringsel{opacity:1}
.ringsel{fill:none;stroke:#fff;stroke-width:1.2;opacity:0;transition:opacity .2s}
.node:focus-visible .dot{stroke:#fff;stroke-width:2}
.notch{fill:var(--amber);stroke:var(--bg);stroke-width:2}
.label{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:.05em;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round;pointer-events:none}
.label .wk{fill:var(--accent)}
.node.soon .label{fill:#C3CCDA}.node.soon .label .wk{fill:rgba(142,243,198,.85)}
.node.now .label{fill:var(--amber)}.node.now .label .wk{fill:var(--amber)}
.signal{fill:var(--accent2);filter:url(#glow)}
.signal.now{fill:var(--amber)}
.core{filter:url(#glow)}
.pulse{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.ctext{font-family:var(--display);font-weight:800;font-size:24px;fill:#fff;letter-spacing:.02em;pointer-events:none}
.csub{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;fill:var(--accent2);pointer-events:none}
.centre{cursor:pointer;outline:none}
.centre .cring{fill:none;stroke:rgba(142,243,198,.6);stroke-width:1;transition:stroke-width .2s,stroke .2s}
.centre:hover .cring,.centre:focus-visible .cring,.centre.active .cring{stroke:#fff;stroke-width:2}

/* the document panel: white paper over the dark screen. Every colour inside it comes from these re-mapped tokens. */
#panel{--fg:#131C26;--muted:#46525F;--dim:#5F6B79;--line:rgba(12,24,36,.12);--accent:#147A4E;--accent2:#0E6A43;--amber:#A86C0C;--code:rgba(20,122,78,.09);--panel:#F3F6F8;--panel2:#FFFFFF;--bg:#FFFFFF;color-scheme:light;color:var(--fg);
  position:fixed;top:0;right:0;bottom:0;width:var(--pw);z-index:20;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--line);
  box-shadow:-24px 0 60px rgba(0,0,0,.5);transform:translateX(102%);visibility:hidden;transition:transform .32s ease,visibility 0s linear .32s;

#panel .pbar button{background:rgba(12,24,36,.03)}

licensed in January 2021 after nine years teaching high-school history: eight months at a franchise office desk, a phone, a headshot and no syllabus. Two closings in that stretch, both from one former colleague. \"I treated it like a job I could study for and found out there was no textbook.\"\n\n## The hardest stretch\n\nYear two, 2022: you bought online leads because everyone around you had, and spent fourteen months chasing people who had clicked a photo once. The open houses were producing — eleven closings, most from a Saturday sign-in — but the lead bill ate the margin. Then an invoice arrived in a month with zero closings: \"I'm paying rent on a pipeline I don't own.\"\n\n## The turning point — when it clicked\n\nA Sunday in October 2022: you pulled every sign-in sheet, sat at the kitchen table, and wrote a five-step routine — every name gets one text by 6 pm Sunday, every text asks one question. Three of those names bought the next quarter, and you cancelled the leads in December. \"It cost nothing — it cost a Sunday.\"\n\n## After — what the business looked like\n\nBy the end of 2023 the routine was the business: about twenty closings a year, six in ten from a Saturday sign-in, no lead bill. The strategy was never the open house — it was the Sunday after it. \"The Saturday gets you the names. The Sunday gets you the clients.\"\n\nThe moment selling houses wasn't enough came in August 2026, when Priya, who had joined in June, texted that her third buyer contract in sixty days had come from the routine. \"Watching it work for Priya felt bigger than any closing I've had.\"\n\nWho you are doing this for: your family, and the teachers you shared a hallway with, who think the only way out of a salary that never moves is a second job. \"I was one of them. If one of them gets a syllabus instead of a lead bill — that's the why.\"\n\n>> \"So that the agents who are where I was in 2022 get the routine instead of the lead bill — and so my own January stops starting at zero.\"\n\n## Everything on file\n## The story (told once, with its turning points)\n\n### How it started\nTaylor got licensed in January 2021 after nine years teaching high-school history, and spent the first eight months at a desk in a franchise office with a phone, a headshot, and no syllabus. Two closings in that stretch — both from the same former teaching colleague, who sent a cousin and then a neighbour. \"I treated it like a job I could study for and found out there was no textbook. Everyone said 'work your sphere' and nobody said what that meant on a Tuesday.\"\n| Who relates to this | a new agent (0–2 years) coming from salaried work — a teacher, a nurse, an office manager — with one or two closings from friends and no idea where number three comes from. |\n\n### The hardest stretch\nYear two, 2022. Taylor signed up for online leads at about $1,100 a month because that is what the agents at the next desks were doing, and spent fourteen months chasing people who had clicked a photo once. The open houses were quietly producing — eleven closings that year, most of them traceable to a Saturday sign-in — but the lead bill ate the margin and the attention. The low point was an invoice that arrived in a month with zero closings. \"I remember opening it at the kitchen table and thinking, I'm paying rent on a pipeline I don't own.\"\n| Who relates to this | the agent two or three years behind Taylor on the same road — 2–5 years in, 4–10 deals a year, paying for leads that don't convert, with sign-in sheets in a drawer and no follow-up. **This line seeds the derived \"who your story speaks to\".** |\n\n### The turning point — when it clicked\nA Sunday in October 2022. Taylor pulled every open-house sign-in sheet from the year, sat at the kitchen table with a legal pad, and wrote a five-step follow-up routine: every name gets one text by 6 pm Sunday, every text asks one question, every answer goes on one sheet. The next quarter three of those names bought. The lead subscription was cancelled in December. The routine has run every Sunday since. \"That was the first time it felt like a system instead of luck. And it cost nothing — it cost a Sunday.\"\n| Who relates to this | the agent who already hosts open houses and already has the names — they are one Sunday away from a pipeline, and they don't know it yet. |\n\n### After — what the business looked like, and the strategy that did it\nBy the end of 2023 the routine was the business: about twenty closings a year, roughly sixty percent traceable to a Saturday sign-in, and no lead bill. The strategy that did it was never the open house itself — it was the Sunday after it: the two-question sheet, five texts by six o'clock, one tracker, one Tuesday look. \"The Saturday gets you the names. The Sunday gets you the clients. Everybody does the Saturday.\" That is the thing Taylor can teach, and the thing agents ask about first.\n| Who relates to this | any agent who already hosts open houses and wants the Sunday — the routine duplicates, which is why Priya and Marcus run it today. |\n\n## The leader moment\n**When selling houses and chasing the next deal wasn't enough:** Tuesday, August 12, 2026. Priya Nair, who had joined Taylor's group in June, texted a screenshot of her third executed buyer contract in sixty days with four words: \"the routine works, Taylor.\" Taylor had taught the sheet and the five texts to one person and it had produced in someone else's hands. \"I'd spent five years making the routine work for me. Watching it work for Priya felt bigger than any closing I've had. That was the day I knew what I was actually building.\"\n**Why revenue share is the key to what they want (and why other agents should care):** \"Selling houses pays me once. Teaching the routine to agents who then teach it pays the group for as long as the group keeps closing — and nobody's counter resets in January. Other agents should care because the same thing is true for them: the first agent you help is the first month your income stops starting at zero.\"\n\n## The WHY\n| Why they got into real estate (the big WHY) | \"I'd spent nine years teaching and watching my salary not move. I wanted work where effort showed up in the result — and I wanted my Sundays back eventually, which is funny, because Sunday is now the whole business.\" |\n\n**Why they want to build a revenue share organization:** \"Because the routine works in other people's hands, and I'm a teacher. A group that teaches the next person is the only version of this I actually want.\"\n| Who they are doing this for | \"My family, and the teachers I used to share a hallway with — the ones who think the only way out of a salary that never moves is a second job. I was one of them.\" · **The life it buys:** \"Sundays that are mine, and an income that doesn't start at zero in January.\" |\n| The why-line (verbatim, one sentence) | \"So that the agents who are where I was in 2022 get the routine instead of the lead bill — and so my own January stops starting at zero.\" |\n(Mike's rule: write it down so on the days you feel like quitting you replay it — 01-foundation-mindset/10.)"}, {"id": "your-brokerage", "label": "YOUR BROKERAGE", "title": "Your brokerage story", "tagline": "Why a Tuesday call moved you, and what most agents miss.", "meta": ["Section 3 of 9 in your Brain Book", "From Conversation 1 · questions 9 to 11 and 13", "Demo"], "feeds": ["conversion", "youtube", "lead-magnet"], "actions": [{"p": "capture this for my attraction brain", "n": "Anything that changes at your brokerage, in one line from the car; it lands in the right file."}, {"p": "paste my compliance link", "n": "The rules come from your brokerage’s own page. No questions."}], "body": "You joined Real Broker in March 2023. At your previous office the counter reset every January. A friend from licensing class had moved to Real the year before and kept describing a Tuesday call where agents taught each other what had worked that week. You ignored it for most of a year — \"I assumed a cloud brokerage meant an office with no walls\" — then went to one call as a guest, watched a four-year agent walk through her sign-in sheet, and thought: that is a classroom.\n\n\"I didn't move for a plan. I moved because the people on that call were teaching, and I'm a teacher.\"\n\n>> \"Nobody joins a brokerage. They join a Tuesday call. A cloud brokerage is a classroom you can take anywhere — most agents still picture an office with no walls, and they're looking at the wrong thing.\"\n\nYou chose Jordan as your sponsor because Jordan had built the kind of business you want to build: a group that teaches rather than a roster that counts. Jordan runs the Tuesday teaching call and joins your calls with agents who want to see how the brokerage works.\n\nWhy revenue share is the key to what you want, in your words: \"Selling houses pays me once. Teaching the routine to agents who then teach it pays the group for as long as the group keeps closing — and nobody's counter resets in January. Other agents should care because the same thing is true for them: the first agent you help is the first month your income stops starting at zero.\" The brokerage is the vehicle; you are the reason.\n\n## Everything on file\n| Brokerage | Real Broker · **Model type:** cloud brokerage with revenue share · **Source documents:** none on file — a real build lists the files in 06 · Materials with dates · **Last reviewed:** 2026-10-03 |\n\n## Mechanics (as the member's materials state them)\n| Split and cap | the agent pays a split until an annual cap, then keeps the full commission for the rest of the anniversary year; the cap resets on the anniversary — generic description; the actual split, cap amount, and reset rule come from the brokerage's documents |\n| Fees | a joining fee, a monthly fee, and per-transaction fees exist in this model type — amounts from the brokerage's documents |\n| Revenue share / profit share | funded from the company's side of the commission on closed deals by agents in the organization — never from the agent's side, never for recruiting; organized in tiers that open as the frontline grows, with an annual maximum per agent per tier — generic description; tier counts and maximums from the brokerage's documents. Illustrative planning figure used in goals.md: ~$4,000 a year per settled frontline agent |\n| Stock / equity | milestone awards (first deal, capping, attracting) and a discounted purchase plan exist in this model type — never project a share price (03-model-positioning/14); details from the brokerage's documents |\n| Sponsorship rules | one sponsor, chosen at joining; co-sponsorship may exist — confirm from the brokerage's documents |\n| Support layers | the brokerage handles transactions, compliance, and technology; the sponsor and upline handle strategy, mentorship, and the Tuesday table; several layers above a new agent in the group |\n| Teams and brokerages inside the model | a team can keep its brand inside the model; a local brokerage can join and keep its name — confirm the exact rule from the brokerage's documents |\n| Offices | no company offices; Taylor's group meets on Zoom; a partner with a local office is the fallback for an in-person need |\n\n## Explained per agent type\n| New agent | the plain picture — no office rent, the brokerage's training library plus Taylor's syllabus, the first year is about the routine and the first three closings, not the model's long-term pieces |\n| Experienced, low production | the cap means a capped year is a good year again; the group is the support the last office didn't have; the longer-term path is explained with the documents on a second call |\n| Top producer | after-cap economics and production awards — only what the materials support; Jordan takes this conversation |\n| Influencer | brand flexibility and reach across Texas — Jordan takes this conversation |\n| Team leader / broker-owner | overhead removed, brand kept, talent retained through sponsorship — corporate joins; not this quarter |\n\n## Q&A bank (questions agents ask, answered from the materials)\n| Q | \"Is this a pyramid scheme?\" — **A:** \"No — nobody is paid for recruiting. The only time anything is paid in the organization is when an agent closes a deal, and it comes from the company's share, not the agent's.\" (generic to the model type; the exact wording from the brokerage's documents in a real build) |\n| Q | \"Do I have to recruit?\" — **A:** \"No. You can run the routine, close deals, and never attract anyone. The organization side is optional.\" (generic; confirm) |\n| Q | \"What happens to my cap from my old office?\" — **A:** \"Ask me on the call — some brokerages honour a cap proven elsewhere until its reset date, and I'd rather check the document than guess.\" (open item — confirm with the brokerage) |\n\n## What the member still needs from their brokerage\n• [ ] the current revenue-share tier sheet, dated — confirm with the brokerage (never in the Book)\n• [ ] the written cap-honouring rule for agents joining mid-year — confirm with the brokerage (never in the Book)"}, {"id": "what-you-teach", "label": "WHAT YOU TEACH", "title": "Your unique approach", "tagline": "The Saturday open house and the Sunday routine you can teach.", "meta": ["Section 4 of 9 in your Brain Book", "From Conversation 2 · questions 14 to 17", "Demo"], "feeds": ["offer", "lead-magnet", "short-form", "youtube", "conversion", "events"], "actions": [{"p": "refine my partner offer", "n": "Change anything about the program this page became."}, {"p": "check my attraction brain", "n": "If a strategy is missing here, the audit will say so."}], "body": "@note: In Week 2 this page became your Partner Offer, Buyers From Open Houses. The offer page holds the program; this page holds the raw material it came from.\n@link: offer | Open your Partner Offer\n\nNext week turns this page into your offer: the one line that says who you help and how.\n\n| Strategy | What it actually involves (your method) | The result you can stand behind | You can teach it |\n| Open houses + the Sunday follow-up routine | A Saturday open house most weekends; the two-question sign-in sheet; every name texted by 6 pm Sunday, one question per text; one tracker; a Tuesday look | About one buyer client per two open houses; six in ten of about twenty closings a year traceable to a sign-in | Yes |\n| Sphere — former teaching colleagues | No system; a handful of referrals a year from the hallway you used to teach in | The first two closings, and one or two a year since | Partly — \"I can teach the ask; I never built the routine for it\" |\n\nThe unique part is not that you host open houses — thousands of agents do. It is that the follow-up actually happens every Sunday, and that every sign-in answers two questions, so the Sunday text has something to say. Because you were a teacher first, the routine is five steps on a sheet another agent can run on their first Sunday: Host, Ask, Text, Track, Table.\n\nWhat your upline — your sponsor and the leaders above them — provides today: Jordan's Tuesday teaching call for the whole group, and Jordan on a call with any agent who wants the brokerage explained properly. That is Jordan's, not yours, and an agent gets it on day one.\n\nThe biggest mistakes you see agents making right now, in your words: \"They're paying for the names instead of following up the ones they already have. Every agent I know hosts open houses; almost none of them text the sheet on Sunday. The second mistake is trying five things at once — a lead subscription, a coaching program, a course — and finishing none of them. I'm the solution because I can show the exact Sunday that fixed it, and joining here means you're not learning it alone — there's a Tuesday table every week.\"\n\n>> What you can teach that most agents can't: the Sunday after the open house — a five-step routine on one sheet that turns names you already have into buyers, with no lead bill.\n\n## Everything on file\n## Known for\n| If other agents knew them for ONE thing | the open-house + Sunday follow-up routine — a buyer pipeline with no lead bill, taught step by step (confirmed by the member in Conversation 2). |\n\n**Niche (the agent problem they solve, by experience):** 2–5 year agents who are paying for online leads with no follow-up system — the exact wall Taylor hit in 2022. Per 04-value-proposition/27: you are most qualified to help the person you used to be.\n\n### Experience → skills (the raw list)\n• Five years of Saturday open houses → sign-in design (the two questions), hosting rhythm, reading a visitor's timeline in one conversation\n• The Sunday routine since October 2022 → the five-step follow-up, five text scripts, the tracker sheet, the Tuesday review\n• Nine years teaching → lesson design, breaking a routine into steps, checking for understanding, patience with a slow start\n• A deliberately simple stack → one Google Sheet, one text template set, no paid portal, no CRM subscription\n\n## What they can teach\n| Strategy they have personally used, or are passionate about teaching | What it actually involved — the unique method (the scripts that convert, the routine, the sheet) | The result they can stand behind | Teach it? (yes / partly / not yet) |\n| Open houses + the Sunday follow-up routine | a Saturday open house most weekends; the two-question sign-in sheet; every name texted by 6 pm Sunday with one question per text; one tracker sheet; a Tuesday look at the sheet | ~1 buyer client per 2 open houses; roughly 60% of ~20 closings a year traceable to a sign-in | yes |\n| Sphere — former teaching colleagues | no system; a handful of referrals a year from the hallway Taylor used to teach in | the first two closings, and one or two a year since | partly — \"I can teach the ask, I never built the routine for it\" |\n\n| The unique part, in one line | the follow-up actually happens every Sunday — and every sign-in answers two questions on the sheet, so the Sunday text has something to say. |\n\n## The mistakes agents are making right now\n\"They're paying for the names instead of following up the ones they already have. Every agent I know hosts open houses; almost none of them text the sheet on Sunday. The second mistake is trying five things at once and finishing none of them.\" — these name the agents who will relate (avatars.md) and the pains the offer answers.\n\n## Priorities\n| Growth focus (next 90 days) | attraction, while keeping Priya and Marcus on the routine (retention of the first two is the proof the next twenty-three will ask about) |\n| Current #1 priority | the first five partners this quarter, without dropping below roughly one personal closing a month |\n| Constraints / capacity | 8 hours a week for attraction (goals.md) · solo, no assistant · no travel · family dinner at 7 pm is the hard stop — nothing after 7 |\n| Three-year commitment stated | yes — \"three years, measured in twelve-week quarters; I'm not doing this for one January\" |\n\n## Leaders and brands they admire\n*Reference only, never copied; feeds brand direction and the content plan. Captured once here, never re-asked.*\n• A former-teacher creator whose explainers are whiteboard-first — \"they never say 'trust me', they show the board\"\n• A cloud-brokerage team leader in another Texas market who runs a public weekly teaching call — \"the call is the brand\""}, {"id": "your-proof", "label": "YOUR PROOF", "title": "Your proof", "tagline": "One buyer per two open houses; Priya's sixty days; Marcus's first Sunday.", "meta": ["Section 5 of 9 in your Brain Book", "From Conversation 3 · questions 18 to 22", "Demo"], "feeds": ["lead-magnet", "short-form", "youtube", "conversion", "events"], "actions": [{"p": "my agent proof", "n": "Add a result, a review from an agent, or a partner’s written OK."}, {"p": "attraction win", "n": "Log a win from the car. It lands here, dated."}], "body": "Your biggest achievements, as you stated them: about twenty closings a year in each of the last two years, six in ten traceable to an open-house sign-in; about one buyer client per two open houses since the Sunday routine started. Awards: none you want public — \"the routine is the credential.\"\n\n| Agent | What you did | What happened | When |\n| Priya Nair | Ran the routine with her from day one — the sheet, the five texts, you on Zoom for her first two Sundays | 3 buyers under contract in her first 60 days | June–August 2026 |\n| Marcus D. | The week-one syllabus; the first lesson together; booked his first open house within ten days | Hosted 2 open houses and texted all 11 first-Sunday sign-ins; first showing booked from a sign-in in week three | September 2026 |\n\nWhy the agents in your group joined you specifically, in your recollection: \"Priya sat in on three Tuesday tables as a guest before she asked — she joined for the table, not the brokerage. Marcus's licensing instructor sent him: 'go find the teacher.'\"\n\nThe moment you almost quit: the invoice in the zero-closing month, opened at the kitchen table with the teaching-jobs tab open on the same screen. What kept you going was the column next to it — the open-house sign-ins, which had quietly produced most of that year's closings.\n\nThe mistakes that taught you something: the relocating couple you met at an open house and never texted — they bought with someone else on the Tuesday. \"The follow-up is the business; a sign-in sheet with no next step is where it leaks.\" And the fourteen months of paying for names: \"a lead bill isn't a system.\"\n\n>> \"I'd been looking at the wrong column.\"\n\n## Everything on file\n## Production wins (said out loud only with their permission)\n• About 20 closings a year in each of the last two years, roughly 60% traceable to an open-house sign-in — Taylor's own tracking, 2024–2025\n• About 1 buyer client per 2 open houses hosted, since the Sunday routine started — own tracking, 2023 onward\n• Capped twice at the previous office before the move, June 2022 and February 2023 — \"I'll say it on a call; I won't put it on a slide\"\n• Awards: none Taylor wants public — \"the routine is the credential\"\n\n## Agents already helped (named, with the result)\n| Agent (first name or initials) | What the member did | What happened | When | OK to use publicly? |\n| Priya Nair | ran the routine with her from day one — the sheet, the five texts, Taylor on Zoom for her first two Sundays | 3 buyers under contract in her first 60 days | June–August 2026 | ask first (consent not yet on file) |\n| Marcus D. | the week-one syllabus; Module 1 together; booked his first open house within ten days | hosted 2 open houses and texted all 11 first-Sunday sign-ins; first showing booked from a sign-in in week three | September 2026 | yes — first name only |\n\n## Organization today\n| Agents in the organization | 2 · **As of:** 2026-10-08 · **Frontline (personally attracted):** 2 (the roster lives in memory/organization.md) |\n\n**Why my agents joined me specifically (Conversation 3, the member's recollection):** \"Priya sat in on three Tuesday tables as a guest before she asked — she joined for the table, not the brokerage. Marcus's licensing instructor sent him: 'go find the teacher.' Neither of them asked about the model until after they'd run a Sunday.\"\n\n## Reviews and testimonials FROM AGENTS (not clients)\n• \"I'd done open houses for three years and never once texted anyone on a Sunday. Taylor gave me the sheet and the five texts and I had a buyer under contract in three weeks.\" — Priya, experienced agent (low production when she joined), 2026 · consent: ask first\n• \"I thought I needed leads. Turns out I needed Sunday.\" — Marcus, new agent, 2026 · consent: yes, first name only\n\n## Upline proof the member may point to\n• Our group runs a Tuesday teaching call where an agent presents what worked that week; Taylor can show a recording on a call — the upline's, Jordan's group\n• Jordan takes the three-way call for anyone who wants the model walked through with the actual documents — the upline's support, labeled as such\n\n## Seeds (from capture — flesh out on \"refresh my proof\")\n• [2026-10-05] Marcus hosted his first open house and texted every sign-in on Sunday — eleven names → the duplication story, first-30-days proof"}, {"id": "who-you-help", "label": "WHO YOU HELP", "title": "Who your story speaks to", "tagline": "The agent paying a lead bill hears you first; you were them.", "meta": ["Section 6 of 9 in your Brain Book", "Worked out from your answers · never asked", "Demo"], "feeds": ["offer", "lead-magnet", "short-form", "youtube", "conversion", "ai-admin", "events"], "actions": [{"p": "refine who I attract", "n": "Sharpen the picture once your content starts pulling a different kind of agent."}, {"p": "add a second avatar", "n": "When a second group keeps showing up in your conversations."}], "body": "Your skills attract any agent. These are the agents who will relate to you most, because you were them.\n\nYour own former self is the 2–5 year agent paying for online leads that don't convert, sign-ins going into a drawer — the agent living your 2022. The agents whose mistakes you named are the same people. The agents who want what you can teach already host open houses and want the Sunday.\n\nThe agent who will hear you first: two to five years in, four to ten deals a year, at a franchise office or on a team, living on portal leads and the occasional open house with no follow-up. Their biggest problem, in your words: \"I'm paying for leads every month and I can't tell you where my next closing is coming from.\" They have probably tried a team \"for the leads\" and a coaching program whose scripts they dropped after week three. What they need to hear: someone who was exactly there, showing the routine that replaced the bill, sheet in hand — a lesson, not a pitch.\n\nA second group your answers point to: the career-changer new agent — a teacher, a nurse, an office manager — with zero to two closings, who did everything the course said and heard nothing. They need a syllabus from someone who also came from a classroom.\n\nThis changes as your content starts pulling a different kind of agent; it can be refined any time.\n\n>> Say it like this: \"In 2022 I opened a lead invoice in a month I'd closed nothing. If that's you right now — I built the routine that replaced that bill, and I'd rather show you than tell you.\"\n\n## Everything on file\n**Who your story speaks to (derived from your answers, never asked):** your own former self: the 2–5 year agent paying for online leads with the sign-ins in a drawer (the hardest stretch, 2022) · the agents whose mistakes you named: agents paying for a lead bill instead of following up the names they already have, and new agents who finished a course and have no syllabus · the agents who want what you can teach: anyone hosting open houses who wants the Sunday routine · reach: anywhere\n\n### Avatar 1 — PRIMARY · \"The 2–5 year agent paying for leads\"\n| Type | experienced, low production (the early end: 2–5 years in) |\n| One-line target | \"2–5 year agents doing 4–10 deals a year, at a franchise office or on a team inside one, who are paying for online leads that don't convert and want a pipeline they actually own.\" |\n| Where they are right now | years licensed 2–5 · deals/year 4–10 · brokerage type: a franchise office, or a team inside one · solo, mostly · how they get business today: portal leads, some sphere, the occasional open house with no follow-up · what they spend money on: a lead subscription in the $800–1,500 a month range and a CRM they rarely open · what they've tried: the subscription, a coach's scripts, a month of door-knocking |\n| Their biggest problem, in their words | \"I'm paying for leads every month and I can't tell you where my next closing is coming from.\" |\n| What they've already tried that didn't work | paid portal leads (the bill stayed, the closings didn't) · switched to a team once \"for the leads\" and watched the split eat them · a twelve-week coaching program with scripts they never used after week three |\n\n**What they'd need to hear to believe this member can help:** someone who was exactly there — paying the bill — showing them the routine that replaced it, step by step, with the sheet in hand. Not a pitch. A lesson. And one agent like them it already worked for.\n| Top pains (ranked, mapped to the five) | 1. Financial uncertainty → the open-house + Sunday routine produces buyers with no lead bill → ~1 buyer per 2 open houses; Priya: 3 buyers under contract in her first 60 days 2. Lack of support, mentorship, training → a teacher-built Module 1 (the two-question sheet) and the Tuesday table → Priya onboarded in two weeks 3. Technology gaps → one Google Sheet and five text templates; nothing to subscribe to → the routine has run every Sunday since October 2022 with no paid tool |\n| Why they'd relate (the mirror) | the hardest stretch (the lead-bill year, the invoice in a zero-closing month) → their present: the same invoice, on the 1st, with the sign-ins in a drawer. **Say it like this:** \"In 2022 I opened a lead invoice in a month I'd closed nothing. If that's you right now — I built the routine that replaced that bill, and I'd rather show you than tell you.\" |\n| Triggers (why they'd move now) | another month's invoice with no closing · a team split that ate the \"free\" leads · the comparison moment when a licensing classmate posts \"closed number twenty\" · hosting an open house for someone else's listing and watching the names go nowhere (the problem they are leaving, never the company) |\n| Where they gather | Instagram (comments under lead-gen and \"is this worth it\" reels) · agent Facebook groups by type (local agent groups, open-house hosting threads) · the local board's lunch-and-learns and continuing-ed classes · title-company classes · the Saturday open-house circuit itself (they are at the next listing over) — types of places, never lists of real people; researched detail lives in prospect-intel.md |\n| How to spot them (observable signals only) | \"busy but broke\" posts · a sign-in clipboard with no next step · asking in groups \"which lead source is actually worth it\" · 2–5 years at the same office · hosting other agents' open houses most Saturdays |\n| Objections to expect | \"Switching didn't work before\" · \"How are you different?\" · \"I need a clear plan\" · \"I don't want to recruit\" · \"I can't afford to lose my leads\" |\n| Content that pulls them in | \"Here's the routine\" teaching reels · the invoice story · the two-question sign-in sheet · Priya's sixty days (with consent) · the \"I already do open houses\" objection reel |\n| The ask that fits | book a call — framed as \"I'll show you the routine in thirty minutes; bring your sign-in sheet\" |\n\n### Avatar 2 — SECONDARY · \"The career-changer new agent\"\n| Type | new agent (0–2 years) |\n| One-line target | \"0–2 year agents coming from salaried work (teachers, nurses, admin, retail managers) with zero to two closings from friends, who are organized and coachable and have no idea where closing number three comes from.\" |\n| Where they are right now | years licensed 0–2 · deals/year 0–2 · brokerage type: a franchise office or a \"new agent\" team · solo · business today: friends and family · spends: very little — afraid of the lead bill · tried: the office's new-agent course (forms, not clients), a few open houses with no follow-up |\n| Their biggest problem, in their words | \"I did everything the course said and nothing happened. Nobody told me what to actually do on a Tuesday.\" |\n| What they've already tried that didn't work | the brokerage's new-agent training · an online course · one month of cold calls from a purchased list |\n\n**What they'd need to hear to believe this member can help:** a syllabus — \"here is what you do in week one, and here is the sheet\" — from someone who also came from a classroom\n| Top pains (ranked, mapped to the five) | 1. Lack of support, mentorship, training → the week-one syllabus and Module 1 → Marcus hosted two open houses and texted all eleven sign-ins on his first Sunday 2. Financial uncertainty → a pipeline that costs a Saturday, not a subscription → Taylor's first system cost nothing 3. Technology gaps → the sheet and the five texts, nothing to buy → the routine runs on a phone and a Google Sheet |\n| Why they'd relate (the mirror) | how it started (two closings from one colleague, no syllabus) → their present: the course ended and the phone is quiet. **Say it like this:** \"My first year I had two closings and both came from the same colleague. Nobody gave me a syllabus. So I wrote one — and I'll hand it to you.\" |\n| Triggers (why they'd move now) | six months in with nothing closed · the office course ended and nothing replaced it · a friend bought with someone else |\n| Where they gather | new-agent Facebook groups · licensing-school alumni groups · the board's new-member orientation · YouTube \"first year in real estate\" comments · former-colleague circles (teachers who are \"thinking about getting licensed\") |\n| How to spot them (observable signals only) | \"just got my license\" posts · asking where to start · a headshot and a bio and no listings · hosting an open house and posting the photo, not the follow-up |\n| Objections to expect | \"I need a local office\" · \"I need local support\" · \"I love my broker\" · \"I don't want to recruit\" · \"I don't have money for another thing\" |\n| Content that pulls them in | \"What I'd do in week one\" series · the syllabus · Marcus's first thirty days (with consent) · the two-closings story |\n| The ask that fits | grab the routine (keyword ROUTINE) → follow → book a call once they have hosted two open houses |\n\n### Avatar 3 — none (keep to two for the first 90 days)\n\n### Not the right fit\nAgents who want leads handed to them — Taylor teaches self-generation, and the routine only works for someone willing to host the Saturday and text on the Sunday. Top producers who want the numbers conversation first — not this quarter; Jordan joins those calls later, when the group has proof at scale. Fit and timing, never a verdict on the agent."}, {"id": "your-numbers", "label": "YOUR NUMBERS", "title": "Your numbers", "tagline": "Two today, twenty-five in a year, a hundred over time, eight hours.", "meta": ["Section 7 of 9 in your Brain Book", "From Conversation 4 · questions 23 to 26", "Demo"], "feeds": ["ai-admin", "conversion", "youtube", "short-form"], "actions": [{"p": "am I on pace to my join target", "n": "The honest answer from your scorecard, in one line."}, {"p": "refresh my attraction plan", "n": "At the end of the quarter: the next 90 days from what actually happened."}], "body": "| Measure | Your number |\n| Agents in your revenue share organization today | 2 |\n| Agents you want to attract in the next 12 months | 25 |\n| Your long-term goal | 100 — \"a hundred agents who all run the Sunday\" |\n| Hours a week you can fully commit to attraction | 8 |\n\nInside those eight hours, a first weekly rhythm: about three conversations with agents a week to start, proposed from your 12-month number — locked when you set your attraction goals.\n\nThe frame these numbers live in is Mike's lesson: commit for three years and measure in twelve-week quarters. Twenty-five in a year is a steep first year; the quarter in front of you is the one that counts.\n\n>> \"Twenty-five agents in twelve months — and every one of them running the Sunday.\"\n\n@link: goals | Open your goals and your tracker"}, {"id": "your-voice", "label": "YOUR VOICE", "title": "Your voice", "tagline": "Calm teacher energy, three signature lines, your three dictated answers.", "meta": ["Section 8 of 9 in your Brain Book", "The three answers you gave out loud, kept as you said them", "Demo"], "feeds": ["lead-magnet", "short-form", "youtube", "conversion", "ai-admin", "events"], "actions": [{"p": "refresh my attraction voice print", "n": "After a few weeks of content, re-read how you actually talk."}, {"p": "add my writing samples to my attraction brain", "n": "A text, a caption, an email, a post: how you write to agents."}], "body": "Your voice in one line: calm, practical, teacher energy — shows, doesn't tell; never hype.\n\n• \"I'd rather show you than tell you.\"\n• \"Here's the routine.\"\n• \"The Saturday gets you the names. The Sunday gets you the clients.\"\n\n## Why I'm excited about agent attraction\n\n\"Okay so, um, the honest answer is Priya. I taught the routine to one person and it worked in her hands, and that did something to me that a closing never did. … Attraction is the first version of this business where the thing I'm actually good at, which is teaching, is the thing that builds it. And I'm excited because the routine is small. It's a Saturday and a Sunday. Anybody can run it.\"\n\n## My why\n\n\"My family first. My husband and the kids — I want Sundays that are actually ours. And then the teachers. The people I used to share a hallway with, who think the only way out of a salary that never moves is a second job. I was one of them. … I want the next person to get the routine on day one instead of in year three.\"\n\n## Why someone should partner with me\n\n\"Um — because I'll sit next to you for the first three Sundays. That's the actual answer. Not a training library, a person. You bring your sign-in sheet to the first call, I give you the five texts, and we run it on your names, live. … What you get from me is a routine you'll own wherever you go, a Tuesday table every week, and somebody who's done the embarrassing year so you don't have to.\"\n\n>> \"Not a training library, a person.\"\n\n## Everything on file\n| Closest to how they talk | warm and patient, with a calm-numbers streak — \"a teacher who likes a spreadsheet\" |\n| How they describe themselves (their own words) | \"I'm not a hype person. I'm the person who writes the steps on the board and then watches you do it.\" |\n\n**What makes them different (specific, never \"great service\"):** the follow-up actually happens every Sunday; Taylor teaches with the sheet in hand, not with adjectives\n| On-camera / communication style | casual, measured, medium-low energy, dry humour; sits at the kitchen table with the whiteboard behind; one idea per sentence |\n\n### This voice SOUNDS like\n• Direct, no hype — the number first, then the story\n• Teacher energy — shows, doesn't tell; \"step one\" before \"why\"\n• Short sentences. One idea at a time. A question at the end.\n• Specific numbers, always labelled as Taylor's own tracking\n• \"We\" when it is the group; \"I\" when it is the routine\n\n### This voice NEVER sounds like\n• \"crush it\", \"grind\", \"level up\", \"let's gooo\", \"secret weapon\", \"game-changer\", \"unlock\"\n• the recruiter voice: pitchy, urgent, \"let's talk about Real\", \"huge opportunity\"\n• vague motivation — anything that could be a poster in a break room\n\n| Three phrases they actually say | \"I'd rather show you than tell you.\" · \"Here's the routine.\" · \"What happens for you after you cap?\" |\n\n**Signature phrases (drafted from their replies — confirm):** \"Here's the routine.\" · \"I'd rather show you than tell you.\" · \"Okay, so — step one.\" · \"The sheet does the convincing.\" · \"Sunday is when it happens.\" · \"Not a pitch — a lesson.\"\n| Never-say list | crush it · grind · level up · secret weapon · game-changer · unlock · \"opportunity\" as a noun for attraction · \"passive income\" · \"let's talk about Real\" · \"huge\" · \"insane\" |\n\n**What they want an agent to FEEL after their content:** \"seen — and clear on what to do this Sunday\"\n| Tone reference (calibration only, never copied) | none named — \"the former-teacher creators who put the board on camera\" |\n\n| Primary CTA | \"Book a call with me — https://book.taylorbrooks.demo/call\" · **Second CTA (the guide / keyword):** ROUTINE → \"The Five-Step Sunday Routine\" (the Lead Magnet plugin's keyword, Week 2 — set in this demo) |\n| Topics most confident on | open houses · follow-up · teaching a brand-new agent · simple tracking · what to do on a Tuesday · **Topics to avoid:** market predictions · anything about compensation in public · anything about another brokerage |\n\n**The one thing they wish struggling agents understood:** \"The lead bill isn't the system. The follow-up is.\"\n\n## How you talk\n\n## Pace & rhythm\nMeasured, with a small pause before every number (\"…eleven sign-ins\"). Short sentences in threes — step one, step two, step three. Slows down for the instruction, speeds up slightly for the story. Pauses after a question to let it land.\n\n## Signature phrases\n• \"Okay, so —\"\n• \"Here's the routine.\"\n• \"Let me show you.\"\n• \"Right?\" — as a check for understanding, not for agreement\n• \"That's step one.\"\n• \"I'd rather show you than tell you.\"\n\n## How they explain hard things\nWhiteboard first: draws the thing before describing it. A worked example before the rule (\"Saturday I had eleven names. Here's what I did with name one.\"). Numbers first, then the story, then the one-line lesson. On a hard objection, repeats the objection back slowly, then \"fair — here's what I'd check.\"\n\n## Energy & humour\nWarm, dry, low-key. Gets visibly animated at exactly one kind of moment — someone else's result (\"and then she texted me the screenshot\"). Jokes at their own expense (\"I was paying rent on a pipeline I didn't own\") and never at anyone else's.\n\n## Filler & tics (a few real ones make dialogue sound human)\n\"okay so\" · \"right?\" · \"kind of\" · \"the thing is\" · a small laugh before admitting a mistake\n\n## Never-say (words/phrases that aren't them)\ncrush it · grind · level up · secret weapon · game-changer · unlock · \"huge opportunity\" · \"passive income\" · \"let's talk about Real\" · \"insane\" · anything shouted\n\n## Sounds like this\n>> \"Okay, so — Saturday I had eleven names on the sheet. Sunday by six every one of them got one text, and every text asked one question. That's it, that's step one — and three of them answered before dinner. Right?\""}, {"id": "whats-next", "label": "WHAT’S NEXT", "title": "What’s next", "tagline": "The brand chat this week, your offer next week: what to type.", "meta": ["Section 9 of 9 in your Brain Book", "Rewritten every time a week lands", "Demo"], "feeds": [], "actions": [], "body": "## This week\n• Finish your lead magnet and its funnel: say \"finish my agent lead magnet\".\n• Your funnel is not live.\n• The Sunday Table is not set up on Skool yet.\n• Your brokerage’s rule on join-gated packages is still being checked.\n\n## Next\n• Your short-form system, in Week 3: say \"set up my attraction short-form\".\n\n## Any time\n• \"just talked to an agent\" from the car. \"show me my Brain\" to refresh your Book. \"run my debrief\" to close the day."}], "OUTER": [{"id": "brand", "label": "BRAND", "week": "W1", "state": "built", "title": "Your brand direction", "tagline": "“Like a well-kept classroom, not a sales floor — calm, warm, and I actually show you the routine.”", "line": "Direction set and the brief issued. The kit itself is not in 02 · Brand yet.", "meta": ["Week 1 · built", "Plugin 1 · the Brain’s brand chat · the Design Studio in Claude Design", "Demo"], "reads": ["who-you-are", "your-story", "your-voice"], "actions": [{"p": "show my design package brief", "n": "Re-opens the brief to paste into Claude Design."}, {"p": "update my attraction brand direction", "n": "Change anything: a colour, the tagline, the logo call."}], "body": "@status: The brand chat: your inventory, one plain question at a time | done | \n@status: The creative direction, derived from your Brain and your three spoken answers | done | \n@status: The Design Package brief
